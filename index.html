<title>Éclaire ton vote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Readex+Pro:wght@300..700&display=swap">
<style>
/* Mise en page : un bureau de vote. Sur grand écran, l'accueil pose la carte de l'Afrique à côté du texte ; ensuite, une seule colonne de lecture (760 px) pour les priorités, les questions et les résultats.
   Couleurs : l'encre électorale violette (celle qui marque le doigt des votants) pour l'action, une lumière ambrée pour « éclairer » ce qui est choisi, le vert et le rouge réservés à la carte. */
:root {
  --paper: #F3F1F8;
  --sheet: #FFFFFF;
  --sheet-2: #EAE6F3;
  --ink: #18142A;
  --muted: #5D5873;
  --line: #E1DCEC;
  --line-strong: #BDB5D2;
  --accent: #5A2DB8;
  --accent-ink: #4A2399;
  --accent-soft: #EFE9FC;
  --on-accent: #FFFFFF;
  --lamp: #F2B42C;
  --lamp-soft: #FDF0CF;
  --on-lamp: #2B1F00;
  --warn: #8F5A0A; --warn-soft: #FBEFD8;
  --check: #57526A; --check-soft: #ECE9F3;
  --shadow: 0 1px 2px rgba(24, 20, 42, .06), 0 8px 24px rgba(24, 20, 42, .07);
  --c-apc: #3B5B8C; --c-adc: #2B7766; --c-ndc: #9A5B16; --c-apm: #97395A; --c-aac: #5B6A1E;
  --c-lepen: #22305E; --c-melenchon: #A8352A; --c-philippe: #1F7A7A; --c-attal: #8A5F0C; --c-retailleau: #3557B8;
  --c-glucksmann: #A8366A; --c-tondelier: #2E7431; --c-roussel: #7A1C2C; --c-zemmour: #4A4E57;
  --on-party: #FFFFFF;
  --up: #2E8B4F; --up-hover: #23703F; --none: #C4453A; --none-hover: #A3372E; --none-hatch: rgba(255,255,255,.28);
  --disputed: #C9C3D3; --land-bg: #E2DEEA; --map-stroke: #FFFFFF;
  --f-display: "Bricolage Grotesque", "Readex Pro", "Segoe UI", system-ui, sans-serif;
  --f-body: "Readex Pro", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r-s: 10px; --r: 16px; --r-l: 24px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #110F19; --sheet: #1B1826; --sheet-2: #242034; --ink: #EEEAF7; --muted: #A9A3BE; --line: #2E2941; --line-strong: #4B4462;
    --accent: #B79FF6; --accent-ink: #CDBBFA; --accent-soft: #2A2243; --on-accent: #150E2B;
    --lamp: #F5C04E; --lamp-soft: #3A2E12; --on-lamp: #1E1600;
    --warn: #E8B867; --warn-soft: #33270F; --check: #B5B0C6; --check-soft: #26232F;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .28);
    --c-apc: #8FAEE0; --c-adc: #6CC9B3; --c-ndc: #E3A75A; --c-apm: #E68AAA; --c-aac: #B9C86A;
    --c-lepen: #9DB0EA; --c-melenchon: #F0907F; --c-philippe: #6CCFCB; --c-attal: #E8BE62; --c-retailleau: #8FA8F2;
    --c-glucksmann: #F08CB9; --c-tondelier: #84D088; --c-roussel: #EE8C9B; --c-zemmour: #BFC3CC;
    --on-party: #110F19;
    --up: #4DB872; --up-hover: #6BCB8C; --none: #D9665C; --none-hover: #E8867D; --none-hatch: rgba(0,0,0,.22);
    --disputed: #4A4559; --land-bg: #262236; --map-stroke: #1B1826;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #110F19; --sheet: #1B1826; --sheet-2: #242034; --ink: #EEEAF7; --muted: #A9A3BE; --line: #2E2941; --line-strong: #4B4462;
  --accent: #B79FF6; --accent-ink: #CDBBFA; --accent-soft: #2A2243; --on-accent: #150E2B;
  --lamp: #F5C04E; --lamp-soft: #3A2E12; --on-lamp: #1E1600;
  --warn: #E8B867; --warn-soft: #33270F; --check: #B5B0C6; --check-soft: #26232F;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .28);
  --c-apc: #8FAEE0; --c-adc: #6CC9B3; --c-ndc: #E3A75A; --c-apm: #E68AAA; --c-aac: #B9C86A;
  --c-lepen: #9DB0EA; --c-melenchon: #F0907F; --c-philippe: #6CCFCB; --c-attal: #E8BE62; --c-retailleau: #8FA8F2;
  --c-glucksmann: #F08CB9; --c-tondelier: #84D088; --c-roussel: #EE8C9B; --c-zemmour: #BFC3CC;
  --on-party: #110F19;
  --up: #4DB872; --up-hover: #6BCB8C; --none: #D9665C; --none-hover: #E8867D; --none-hatch: rgba(0,0,0,.22);
  --disputed: #4A4559; --land-bg: #262236; --map-stroke: #1B1826;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.6; font-weight: 400; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1140px; margin: 0 auto; padding-inline: 16px; padding-block: 14px 56px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; font-weight: 700; }
p { margin: 0; }
a { color: var(--accent-ink); text-underline-offset: 3px; text-decoration-thickness: 1px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.mono { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.eyebrow { font-size: .74rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Barre du haut */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px 14px; flex-wrap: wrap; padding-block: 6px 12px; }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; cursor: pointer; }
.brand-mark { width: 32px; height: 32px; border-radius: 9px; background: var(--accent); display: grid; place-items: center; position: relative; flex: none; }
.brand-mark svg { width: 26px; height: 26px; position: absolute; left: 6px; top: -2px; overflow: visible; }
.brand-mark svg path { fill: none; stroke: var(--lamp); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
.brand-name { font-family: var(--f-display); font-weight: 800; font-size: 1.18rem; letter-spacing: -.015em; font-stretch: 92%; }
.top-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.langs { display: flex; gap: 2px; background: var(--sheet); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.langs button { background: none; border: 0; padding: 4px 10px; border-radius: 999px; font-size: .74rem; font-weight: 600; letter-spacing: .04em; cursor: pointer; color: var(--muted); }
.langs button:hover { color: var(--ink); }
.langs button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.langs button:disabled { opacity: .45; cursor: not-allowed; }
.proto-tag { font-size: .72rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); background: var(--lamp-soft); padding: 4px 10px; border-radius: 999px; }

/* Case de bulletin (coche) */
.box { display: inline-grid; place-items: center; width: 24px; height: 24px; border: 2px solid var(--line-strong); border-radius: 7px; position: relative; flex: none; background: var(--sheet); }
.box svg { position: absolute; width: 130%; height: 130%; left: 0; top: -34%; overflow: visible; visibility: hidden; }
.box svg path { fill: none; stroke: var(--lamp); stroke-width: 3.8; stroke-linecap: round; stroke-linejoin: round; }

/* Étapes */
.steps { display: flex; gap: 6px; list-style: none; margin: 6px auto 0; padding: 0; flex-wrap: wrap; max-width: 760px; }
.steps li { display: flex; align-items: center; gap: 8px; font-size: .84rem; color: var(--muted); background: var(--sheet); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px 4px 5px; }
.steps .n { font-size: .74rem; font-weight: 600; width: 22px; height: 22px; display: inline-grid; place-items: center; border-radius: 50%; background: var(--sheet-2); color: var(--muted); font-variant-numeric: tabular-nums; }
.steps li.done .n { background: var(--accent); color: var(--on-accent); }
.steps li.on { color: var(--ink); font-weight: 600; border-color: var(--ink); }
.steps li.on .n { background: var(--ink); color: var(--paper); }

/* Boutons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 22px; border-radius: 999px; font-weight: 600; cursor: pointer; border: 1.5px solid transparent; text-align: center; transition: transform .12s, background-color .15s, border-color .15s; }
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-primary:hover { background: var(--accent-ink); }
.btn-primary:active { transform: translateY(1px); }
.btn-ghost { background: var(--sheet); border-color: var(--line-strong); color: var(--ink); }
.btn-ghost:hover { border-color: var(--ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.link { background: none; border: 0; padding: 0; color: var(--accent-ink); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; cursor: pointer; text-align: start; }

main { display: block; }
.screen { display: grid; gap: 24px; padding-top: 22px; max-width: 760px; margin-inline: auto; }
.big-title { font-size: clamp(1.75rem, 5.4vw, 2.5rem); font-weight: 750; line-height: 1.06; letter-spacing: -.02em; font-stretch: 90%; }
.lead { font-size: 1.08rem; max-width: 62ch; color: var(--muted); }
.block { display: grid; gap: 10px; }
.caveat { font-size: .9rem; color: var(--muted); background: var(--sheet-2); border-radius: var(--r-s); padding: 10px 14px; max-width: 70ch; }
details > summary { cursor: pointer; color: var(--accent-ink); font-weight: 600; width: fit-content; }
.tagline { font-size: .82rem; color: var(--muted); letter-spacing: .01em; }

/* ============ Accueil : la carte ============ */
.screen.map-screen { max-width: none; display: grid; gap: 22px 40px; grid-template-columns: minmax(0, 1fr); grid-template-areas: "intro" "map" "side"; padding-top: 18px; }
.map-intro { grid-area: intro; display: grid; gap: 14px; align-content: start; }
.map-card { grid-area: map; background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r-l); padding: 14px 10px 8px; box-shadow: var(--shadow); position: relative; min-width: 0; }
.map-side { grid-area: side; display: grid; gap: 18px; align-content: start; min-width: 0; }
@media (min-width: 900px) {
  .screen.map-screen { grid-template-columns: minmax(0, 0.82fr) minmax(0, 1.18fr); grid-template-areas: "intro map" "side map"; align-items: start; padding-top: 34px; }
  .map-card { padding: 22px 18px 12px; }
}
.kicker { display: inline-flex; align-items: center; gap: 8px; width: fit-content; font-size: .78rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--accent-ink); background: var(--accent-soft); padding: 5px 12px 5px 8px; border-radius: 999px; }
.kicker::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--up); box-shadow: 0 0 0 3px color-mix(in srgb, var(--up) 25%, transparent); }
.map-title { font-family: var(--f-display); font-weight: 800; font-size: clamp(2.1rem, 7vw, 3.6rem); line-height: .98; letter-spacing: -.03em; font-stretch: 85%; }
.map-title em { font-style: normal; background: linear-gradient(transparent 62%, var(--lamp-soft) 62%); }
.legend { display: grid; gap: 0; list-style: none; margin: 0; padding: 0; background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); }
.legend li { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 10px 14px; font-size: .92rem; }
.legend li + li { border-top: 1px solid var(--line); }
.legend .cnt { font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.sw { width: 18px; height: 18px; border-radius: 5px; flex: none; }
.sw.up { background: var(--up); }
.sw.none { background: repeating-linear-gradient(135deg, var(--none) 0 4px, color-mix(in srgb, var(--none) 75%, white) 4px 6px); }
.sw.disp { background: var(--disputed); }
.sw.ready { background: var(--sheet); border: 3px solid var(--ink); border-radius: 50%; }
.map-wrap { position: relative; }
.map-wrap svg { display: block; width: 100%; height: auto; max-width: 720px; margin: 0 auto; }
.map-wrap .ctry { stroke: var(--map-stroke); stroke-width: .9; cursor: pointer; transition: fill .15s; outline: none; }
.map-wrap .ctry.up { fill: var(--up); }
.map-wrap .ctry.none { fill: url(#hatch); }
.map-wrap .ctry.up:hover, .map-wrap .ctry.up.hl { fill: var(--up-hover); }
.map-wrap .ctry.none:hover, .map-wrap .ctry.none.hl { fill: var(--none-hover); }
.map-wrap .ctry:focus-visible { stroke: var(--ink); stroke-width: 2.5; }
.map-wrap .disp { fill: var(--disputed); stroke: var(--map-stroke); stroke-width: .9; stroke-dasharray: 3 2; }
.map-wrap .nb { fill: var(--land-bg); }
.map-wrap .isl { stroke: var(--map-stroke); stroke-width: 1.5; cursor: pointer; }
.map-wrap .isl.up { fill: var(--up); }
.map-wrap .isl.none { fill: var(--none); }
.map-wrap .isl-hit { fill: transparent; cursor: pointer; }
.map-wrap .pin { fill: var(--sheet); stroke: var(--ink); stroke-width: 2.5; pointer-events: none; }
.map-wrap .pin-check { fill: none; stroke: var(--accent); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.map-hint { text-align: center; font-size: .82rem; color: var(--muted); padding: 4px 8px 6px; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--paper); padding: 7px 11px; border-radius: var(--r-s); font-size: .85rem; line-height: 1.35; max-width: 250px; box-shadow: var(--shadow); z-index: 2; }
.tip b { display: block; font-family: var(--f-display); }
.clist-wrap { display: block; background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.clist-wrap[open] > summary { margin-bottom: 12px; }
#clist { margin-top: 6px; }
.clist-wrap input { width: 100%; font: inherit; padding: 10px 14px; border: 1.5px solid var(--line-strong); border-radius: 999px; background: var(--paper); color: var(--ink); }
.clist-group { display: grid; gap: 6px; }
.clist-group h3 { font-family: var(--f-body); font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-top: 8px; }
.clist2 { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 6px; }
.cbtn { width: 100%; display: flex; gap: 10px; align-items: flex-start; padding: 9px 11px; border: 1px solid var(--line); border-radius: var(--r-s); background: var(--paper); cursor: pointer; text-align: start; }
.cbtn:hover { border-color: var(--line-strong); }
.cbtn .dot { width: 11px; height: 11px; border-radius: 50%; margin-top: 6px; flex: none; }
.cbtn .dot.up { background: var(--up); }
.cbtn .dot.none { background: var(--none); }
.cbtn .cn2 { font-weight: 600; display: block; }
.cbtn .cs2 { font-size: .8rem; color: var(--muted); display: block; }
.outside { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 12px 14px; border: 1.5px dashed var(--line-strong); border-radius: var(--r); }

/* ============ Bandeau élection ============ */
.strip { display: flex; justify-content: space-between; align-items: center; gap: 10px 16px; flex-wrap: wrap; padding: 16px 18px; background: var(--accent); color: var(--on-accent); border-radius: var(--r); }
.strip b { font-family: var(--f-display); font-size: 1.2rem; font-weight: 750; letter-spacing: -.01em; }
.strip .sd { opacity: .85; font-size: .94rem; }
.strip .link { color: var(--on-accent); }
.about { display: grid; gap: 0; background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding-inline: 16px; }
.about > details { padding-block: 13px; }
.about > details + details { border-top: 1px solid var(--line); }
.about details[open] > summary { margin-bottom: 14px; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0 0 12px; }
.facts div { background: var(--paper); border-radius: var(--r-s); padding: 10px 12px; display: grid; gap: 2px; }
.facts dt { font-size: .8rem; color: var(--muted); }
.facts dd { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 1.02rem; }
@media (max-width: 600px) { .facts { grid-template-columns: 1fr; } }
.sys { display: grid; padding: 0; margin: 0; list-style: none; }
.sys li { display: grid; grid-template-columns: 11rem minmax(0, 1fr); gap: 4px 16px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: .95rem; }
.sys li b { font-weight: 600; }
.sys li:last-child { border-bottom: 0; }
@media (max-width: 560px) { .sys li { grid-template-columns: 1fr; } }
.basis { font-size: .95rem; background: var(--lamp-soft); border-radius: var(--r-s); padding: 12px 14px; margin-bottom: 10px; }
.party-list { list-style: none; margin: 0; padding: 0; }
.party-list li + li { border-top: 1px solid var(--line); }
.party-btn { width: 100%; display: flex; align-items: center; gap: 12px; padding: 11px 4px; background: none; border: 0; cursor: pointer; text-align: start; border-radius: var(--r-s); }
.party-btn:hover { background: var(--paper); }
.party-btn .pb-text { display: grid; min-width: 0; flex: 1; }
.party-btn .pb-name { font-weight: 600; }
.party-btn .pb-sub { color: var(--muted); font-size: .88rem; }
.others { margin: 10px 0 0; padding-inline-start: 20px; display: grid; gap: 4px; font-size: .92rem; }
.src { font-size: .82rem; }

/* Badges : sigle seulement, aucun logo */
.badge { --pc: var(--accent); display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: var(--pc); color: var(--on-party); flex: none; font-weight: 600; font-size: .72rem; letter-spacing: .03em; }
.badge.sm { width: 30px; height: 30px; font-size: .58rem; }
.badge.lg { width: 60px; height: 60px; font-size: .92rem; }
.chip { font-size: .7rem; letter-spacing: .05em; text-transform: uppercase; padding: 2px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; white-space: nowrap; }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.grey { background: var(--check-soft); color: var(--check); }

/* ============ Priorités ============ */
.theme-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 600px) { .theme-grid { grid-template-columns: 1fr; } }
@media (min-width: 720px) { .theme-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.theme-opt { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto auto 1fr; gap: 3px 12px; padding: 14px 16px; border: 1.5px solid var(--line); border-radius: var(--r); background: var(--sheet); cursor: pointer; text-align: start; align-items: start; transition: border-color .15s, background-color .15s; }
.theme-opt:hover { border-color: var(--line-strong); }
.theme-opt .box { margin-top: 2px; grid-row: span 3; }
.theme-opt .tn { font-family: var(--f-display); font-weight: 700; font-size: 1.06rem; line-height: 1.25; }
.theme-opt .tm { font-size: .82rem; color: var(--muted); }
.theme-opt .tq { align-self: end; padding-top: 4px; font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.theme-opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.theme-opt[aria-pressed="true"] .box { background: var(--accent); border-color: var(--accent); }
.theme-opt[aria-pressed="true"] .box svg { visibility: visible; }
.theme-opt:disabled { opacity: .45; cursor: not-allowed; }

.q-meta { display: flex; justify-content: space-between; gap: 6px 12px; flex-wrap: wrap; align-items: center; }

.q-min { font-size: .84rem; color: var(--muted); margin-top: -14px; }
.slip { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r-l); padding: 26px 24px 20px; display: grid; gap: 16px; box-shadow: var(--shadow); }
.slip h2 { font-weight: 600; font-size: clamp(1.25rem, 4.2vw, 1.62rem); line-height: 1.3; letter-spacing: -.01em; }
.slip details p { margin-top: 10px; color: var(--muted); max-width: 66ch; }
.answers { border: 0; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.ans { display: grid; justify-items: center; align-content: start; gap: 10px; padding: 16px 8px 14px; border: 1.5px solid var(--line); border-radius: var(--r); background: var(--sheet); cursor: pointer; text-align: center; font-size: .92rem; font-weight: 500; line-height: 1.25; transition: border-color .15s, background-color .15s, transform .12s; }

}
.double { display: flex; align-items: center; gap: 10px; cursor: pointer; width: fit-content; font-size: .95rem; }
.double input { width: 20px; height: 20px; accent-color: var(--accent); }
.q-nav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 16px; }

/* ============ Résultats ============ */

.tab[aria-selected="true"] { color: var(--paper); background: var(--ink); font-weight: 600; }
@media (max-width: 480px) { .tab { padding: 8px 10px; font-size: .9rem; } }

.rank-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }

.pu { font-family: var(--f-body); font-size: .7em; font-weight: 500; }

.theme-cards { display: grid; gap: 12px; }

.tc-head { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: center; }
.tc-head h3 { font-size: 1.12rem; font-weight: 700; }
.verdict-line { max-width: 66ch; }
.mini { display: grid; gap: 8px; }
.mini-row { display: grid; grid-template-columns: 30px minmax(0, 13rem) minmax(0, 1fr) 3.8rem; gap: 10px; align-items: center; font-size: .9rem; }

.mini-row .pct { font-size: .98rem; text-align: end; }

@media (max-width: 480px) { .mini-row { grid-template-columns: 30px minmax(0, 1fr) 3.4rem; } .mini-row .bar, .mini-row .ndt { grid-column: 2 / 4; grid-row: 2; } }

.qa-text { font-weight: 600; font-size: 1.03rem; max-width: 66ch; }

.kind { font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.skipped-note { font-size: .9rem; color: var(--muted); font-style: italic; }

.formula { font-variant-numeric: tabular-nums; background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r-s); padding: 12px 14px; font-size: .88rem; overflow-x: auto; white-space: nowrap; }

dialog { border: 0; padding: 0; border-radius: var(--r-l); background: var(--paper); color: var(--ink); width: min(680px, calc(100% - 24px)); max-height: calc(100% - 32px); box-shadow: 0 24px 60px rgba(0,0,0,.3); }

.fiche h3 { font-family: var(--f-body); font-size: .74rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.commit { list-style: none; margin: 0; padding: 0; display: grid; border-top: 1px solid var(--line); }

/* ============ Choix de la langue ============ */
#langDlg { width: min(460px, calc(100% - 24px)); }

.lang-box .st { color: var(--muted); font-size: .92rem; }
.lang-grid { display: grid; gap: 8px; }

.lang-btn { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; padding: 13px 18px; border: 1.5px solid var(--line); border-radius: var(--r); background: var(--sheet); cursor: pointer; font-size: 1.1rem; font-weight: 600; }
.lang-btn:hover, .lang-btn.cur { border-color: var(--accent); background: var(--accent-soft); }
.lang-btn .lc { font-size: .74rem; color: var(--muted); font-weight: 600; letter-spacing: .06em; }

/* ============ Pays sans questionnaire ============ */
.ev-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.ev-list li { display: flex; gap: 12px; align-items: baseline; padding: 13px 16px; background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); }
.ev-list li .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; transform: translateY(1px); }
.ev-list li .dot.up { background: var(--up); }
.ev-list li .dot.none { background: var(--none); }

/* Arabe : pas d'espacement entre lettres, interligne plus généreux */
[dir="rtl"] body * { letter-spacing: 0 !important; }
[dir="rtl"] body { line-height: 1.75; }
[dir="rtl"] .map-title, [dir="rtl"] .big-title { line-height: 1.25; }

footer { margin-top: 56px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: .85rem; display: grid; gap: 6px; max-width: 760px; margin-inline: auto; }

@media (prefers-reduced-motion: no-preference) {
  .screen { animation: rise .3s ease-out; }
  .bar span { transition: width .6s cubic-bezier(.2,.7,.2,1); }
  @keyframes rise { from { transform: translateY(6px); } to { transform: none; } }
}

    { theme: "security", short: "Foreign military strikes",

    { theme: "security", short: "No ransom, no negotiation",

    { theme: "security", short: "Community security outfits",
      text: "Community and regional security outfits, such as Amotekun in the South-West, should be strengthened and allowed to work alongside the police.",
      ctx: "Several states created their own security outfits to fill gaps left by federal forces. They know the terrain. Critics warn they can be hard to control and may target particular communities.",

        apm: { p: 2, k: "older", s: "makinde_2024", n: "Makinde cites Amotekun and neighbourhood watches as building blocks of state policing." },
        aac: { p: 1, k: "stated", s: "sowore_police", n: "Sowore also backs local government, campus and township police." }

    { theme: "gov", short: "Mandatory e-transmission of results",
      text: "Real-time electronic transmission of polling-unit results to INEC’s public portal (IReV) should be mandatory by law.",
      ctx: "The Electoral Act 2026 leaves electronic transmission optional and keeps manual collation as the legal record. Supporters of a mandate say it limits tampering between polling unit and collation centre. Opponents cite weak network coverage in rural areas.",

        apc: { p: -2, k: "record", s: "etrans_law", n: "President Tinubu backed keeping transmission optional, citing coverage and the risk of glitches." },

        ndc: { p: 2, k: "stated", s: "etrans_pos", n: "Obi supports mandatory real-time transmission." },
        aac: { p: 2, k: "stated", s: "occupynass", n: "Sowore joined the protests at the National Assembly demanding it." }
      } },
    { theme: "gov", short: "Restructuring",
      text: "The constitution should transfer major powers and revenues from the federal government to the states (restructuring).",
      ctx: "The federal government controls the police, mines, railways and most public revenue. Restructuring would hand more of these to the states. Supporters say it fits Nigeria’s diversity. Critics fear poorer states would fall further behind.",
      cells: {
        adc: { p: 2, k: "older", s: "atiku_restr", n: "Atiku calls restructuring “one of the pillars” of his government, giving states and local governments more powers." },
        ndc: { p: 1, k: "older", s: "obi_restr", n: "Obi has said he would include restructuring in his administration, without details." },
        apm: { p: 2, k: "older", s: "makinde_2024", n: "Makinde calls for constitutional reform towards fiscal federalism, restructuring and state police." }
      }, nd: { apc: "The APC government backs specific transfers (state police, power generation) but has not adopted a broad restructuring programme." } },
    { theme: "gov", short: "Direct funding of local governments",
      text: "Local governments should receive their federal allocations directly, without state governors controlling the money.",
      ctx: "In July 2024 the Supreme Court ruled that states cannot hold or manage local government funds. Many governors still control council finances in practice. Direct payment could bring services closer to people, or simply move mismanagement down a level.",

        adc: { p: 1, k: "older", s: "atiku_restr", n: "Atiku has promised more powers and autonomy for local government areas." },
        aac: { p: 2, k: "stated", s: "sowore_police", n: "Sowore wants greater local government autonomy and accuses governors of taking council funds." }
      } },

    { theme: "edu", short: "Free public universities",
      text: "Public universities should be tuition-free, rather than relying on student loans.",
      ctx: "Since 2024 the federal student loan fund (NELFUND) has lent over ₦300 billion to more than 1.6 million students. Supporters say loans widen access. Critics say graduates without jobs will struggle to repay.",
      cells: {
        apc: { p: -1, k: "record", s: "nelfund", n: "Tinubu wants the student loan scheme to be permanent. The government has not promised free tuition." },
        adc: { p: 1, k: "stated", s: "atiku_nelfund", n: "Atiku’s team calls a student loan “a liability” and promises to forgive qualifying student debts." },
        ndc: { p: 0, k: "older", s: "obi_univ", n: "In 2022 Obi promised both better university funding and student loans." },

    { theme: "edu", short: "State of emergency in education",

    { theme: "edu", short: "Mother-tongue teaching",

      ctx: "A 2022 national policy made indigenous languages the medium of instruction in early primary school. In November 2025 the federal government cancelled it and returned to English.",
      cells: {
        apc: { p: -2, k: "record", s: "mother", n: "The federal government cancelled the mother-tongue policy in November 2025." }

    { theme: "health", short: "Wider health insurance",
      text: "Health insurance should be expanded so that most Nigerians are covered, with the state paying for the poorest.",

    { theme: "health", short: "A health centre in every ward",

    { theme: "social", short: "Raise and index the minimum wage",

    { theme: "social", short: "Cash transfers as main cushion",
      text: "Direct cash transfers to poor households are the best way to cushion the cost of economic reforms.",
      ctx: "The federal government pays cash transfers to poor households listed in the National Social Register. Supporters say cash reaches people fast. Critics say the amounts are small and the register misses many poor families.",

        ndc: { p: -1, k: "older", s: "obi_cct", n: "Obi has argued that cash transfers cannot lift people out of poverty and prefers jobs and micro-credit." }

    { theme: "social", short: "A Social Protection Act",
      text: "Welfare programmes should be guaranteed by a Social Protection Act, so they do not depend on the government of the day.",

      cells: {

        adc: { p: 2, k: "stated", s: "adc_blueprint", n: "The ADC proposes a Social Protection Act." }
      } },

    { theme: "energy", short: "Cost-reflective electricity tariffs",
      text: "Electricity tariffs should reflect the real cost of supply, with public support limited to the poorest.",
      ctx: "Since 2024, “Band A” customers who get at least 20 hours of power a day pay a cost-reflective tariff. The government says it spent about ₦3.14 trillion on electricity subsidies between mid-2023 and the end of 2025 and plans to phase them out gradually.",
      cells: {
        apc: { p: 2, k: "record", s: "power_adc", n: "The government introduced the Band A tariff and plans to phase out the remaining subsidies gradually." },
        adc: { p: -2, k: "stated", s: "power_adc", n: "Amaechi, Atiku’s running mate, says an ADC government would subsidise power and scrap Bands A and B." }
      } },
    { theme: "energy", short: "Power outside the national grid",
      text: "States, communities and private firms should be free to build their own power plants and mini-grids, instead of relying on the national grid.",
      ctx: "The Electricity Act 2023 lets states regulate their own electricity markets and allows private generation. The national grid has collapsed repeatedly. Critics warn that fragmented markets could leave poorer states behind.",
      cells: {

        ndc: { p: 2, k: "stated", s: "obi_agenda", n: "Obi wants successful independent power models replicated nationwide, with more private participation." },
        apm: { p: 2, k: "older", s: "makinde_2024", n: "Makinde cites the devolution of power generation to the states as a model to follow." }
      } },
    { theme: "energy", short: "Ogoniland: clean-up before oil",
      text: "Oil production in Ogoniland should not resume until the clean-up is complete and local communities agree.",
      ctx: "Oil extraction in Ogoniland stopped in 1993. A UN-recommended clean-up started years ago and activists say it could take decades more. The federal government is preparing to resume production. Ogoni groups and rights organisations want remediation and justice first.",
      cells: {
        apc: { p: -1, k: "record", s: "ogoni", n: "The government is preparing to resume production, tied to its 2026 oil output target." }

      n: { apc: "Le président Tinubu a soutenu le maintien d’une transmission facultative, en invoquant la couverture réseau et le risque de pannes.", adc: "Atiku a qualifié le refus de la rendre obligatoire de « grave recul pour la réforme électorale ».", ndc: "Obi soutient une transmission obligatoire en temps réel.", aac: "Sowore a participé aux manifestations devant l’Assemblée nationale pour l’exiger." } },
    { short: "Restructuration", text: "La Constitution devrait transférer des pouvoirs et des recettes importants du gouvernement fédéral vers les États (« restructuration »).",
      ctx: "Le gouvernement fédéral contrôle la police, les mines, les chemins de fer et l’essentiel des recettes publiques. La restructuration en confierait davantage aux États. Ses partisans disent qu’elle correspond à la diversité du Nigeria. Ses détracteurs craignent que les États pauvres décrochent.",
      n: { adc: "Atiku fait de la restructuration « l’un des piliers » de son gouvernement, avec plus de pouvoirs pour les États et les collectivités locales.", ndc: "Obi a dit qu’il inclurait la restructuration dans son action, sans détails.", apm: "Makinde appelle à une réforme constitutionnelle vers le fédéralisme fiscal, la restructuration et la police des États." },
      nd: { apc: "Le gouvernement APC soutient des transferts précis (police des États, production d’électricité) mais n’a pas adopté de programme global de restructuration." } },
    { short: "Financement direct des collectivités locales", text: "Les collectivités locales devraient recevoir directement leurs dotations fédérales, sans que les gouverneurs contrôlent l’argent.",
      ctx: "En juillet 2024, la Cour suprême a jugé que les États ne peuvent pas détenir ni gérer les fonds des collectivités locales. Dans les faits, beaucoup de gouverneurs contrôlent encore leurs finances. Le paiement direct pourrait rapprocher les services de la population, ou simplement déplacer la mauvaise gestion d’un échelon.",
      n: { apc: "Tinubu a averti les gouverneurs de respecter la décision et menacé de payer directement les collectivités.", adc: "Atiku a promis plus de pouvoirs et d’autonomie aux collectivités locales.", aac: "Sowore veut plus d’autonomie pour les collectivités locales et accuse les gouverneurs de détourner leurs fonds." } },
    { short: "Universités publiques gratuites", text: "Les universités publiques devraient être gratuites, plutôt que de reposer sur des prêts étudiants.",
      ctx: "Depuis 2024, le fonds fédéral de prêts étudiants (NELFUND) a prêté plus de 300 milliards de nairas à plus de 1,6 million d’étudiants. Ses partisans disent que les prêts élargissent l’accès. Ses détracteurs disent que les diplômés sans emploi auront du mal à rembourser.",
      n: { apc: "Tinubu veut rendre le dispositif de prêts permanent. Le gouvernement n’a pas promis la gratuité.", adc: "L’équipe d’Atiku qualifie le prêt étudiant de « dette » et promet d’effacer certaines dettes étudiantes.", ndc: "En 2022, Obi promettait à la fois un meilleur financement des universités et des prêts étudiants.", aac: "L’AAC promet l’éducation gratuite à tous les niveaux." } },
    { short: "État d’urgence dans l’éducation", text: "Le gouvernement fédéral devrait déclarer l’état d’urgence dans l’éducation et augmenter fortement les dépenses éducatives.",
      ctx: "Le Nigeria compte l’un des plus grands nombres d’enfants non scolarisés au monde, et les universités publiques ont subi des grèves répétées des enseignants.",
      n: { adc: "Le programme de l’ADC déclare l’état d’urgence dans l’éducation.", ndc: "Obi promet davantage d’investissements dans les écoles, la formation des enseignants, le numérique et la formation professionnelle.", aac: "Sowore promet l’éducation et les examens publics gratuits, ce qui exigerait beaucoup plus de dépenses publiques." },
      nd: { apm: "Makinde promet « une nouvelle voie pour l’éducation », sans précisions." } },
    { short: "Enseignement en langue maternelle", text: "Les enfants devraient être scolarisés dans leur langue maternelle pendant les premières années du primaire.",
      ctx: "Une politique nationale de 2022 faisait des langues locales la langue d’enseignement au début du primaire. En novembre 2025, le gouvernement fédéral l’a annulée et est revenu à l’anglais.",
      n: { apc: "Le gouvernement fédéral a annulé la politique de la langue maternelle en novembre 2025." } },
    { short: "Assurance maladie élargie", text: "L’assurance maladie devrait être étendue pour couvrir la plupart des Nigérians, l’État payant pour les plus pauvres.",
      ctx: "La plupart des Nigérians paient leurs soins de leur poche. L’assurance maladie existe depuis des années, mais ne couvre qu’une petite partie de la population.",
      n: { adc: "Le programme de l’ADC promet d’élargir la couverture santé.", ndc: "Obi promet de porter la couverture d’environ 10 % à plus de 20 % en quatre ans." } },
    { short: "Un centre de santé par circonscription", text: "Les dépenses de santé devraient fortement augmenter, avec un centre de santé primaire pleinement fonctionnel dans chacune des 8 809 circonscriptions du Nigeria.",
      ctx: "Les centres de santé primaires sont censés être le premier recours, mais beaucoup manquent de personnel, d’électricité ou de médicaments. Plus de dépenses de santé, c’est moins pour la sécurité, le remboursement de la dette ou d’autres priorités.",
      n: { adc: "L’ADC donne la priorité à la prévention et au renforcement des centres de santé primaires.", ndc: "Obi promet un centre de santé primaire fonctionnel dans chaque circonscription et davantage de dépenses de santé." } },
    { short: "Hausser et indexer le salaire minimum", text: "Le salaire minimum de 70 000 ₦ devrait être relevé maintenant et ajusté chaque année au coût de la vie, plutôt que révisé tous les trois ans.",
      ctx: "La loi de 2024 a fixé le salaire minimum à 70 000 ₦ par mois, avec une révision tous les trois ans. Les prix de l’alimentation et du transport ont fortement augmenté depuis. Des salaires plus élevés aident les travailleurs mais pèsent sur les États et les petites entreprises qui les paient.",
      n: { apc: "La loi de 2024 signée par Tinubu prévoit une révision tous les trois ans ; ses proches parlent de salaire décent.", adc: "Atiku juge 70 000 ₦ « largement insuffisant » et promet des hausses liées au coût de la nourriture, du transport, du loyer et de l’électricité.", aac: "L’AAC promet un salaire minimum de 500 000 ₦." } },
    { short: "Transferts monétaires comme principal amortisseur", text: "Les transferts d’argent directs aux foyers pauvres sont le meilleur moyen d’amortir le coût des réformes économiques.",
      ctx: "Le gouvernement fédéral verse des transferts monétaires aux foyers pauvres inscrits au Registre social national. Ses partisans disent que l’argent arrive vite. Ses détracteurs disent que les montants sont faibles et que le registre oublie beaucoup de familles pauvres.",
      n: { apc: "Le gouvernement dit avoir versé 330 milliards de nairas à 8,5 millions de foyers et veut inscrire les transferts dans chaque budget.", adc: "L’ADC veut une protection sociale pour amortir les réformes, avec un salaire décent.", ndc: "Obi a soutenu que les transferts monétaires ne sortent pas les gens de la pauvreté et préfère l’emploi et le microcrédit." } },
    { short: "Une loi sur la protection sociale", text: "Les programmes sociaux devraient être garantis par une loi sur la protection sociale, pour ne plus dépendre du gouvernement en place.",
      ctx: "Les programmes sociaux du Nigeria ont été renommés, suspendus et réorganisés plusieurs fois, notamment après des scandales de corruption. Une loi leur donnerait une base légale et une ligne budgétaire stables, mais figerait aussi ces dépenses.",
      n: { apc: "Le gouvernement dit intégrer les transferts monétaires au budget national, sans loi dédiée.", adc: "L’ADC propose une loi sur la protection sociale." } },
    { short: "Tarifs d’électricité au coût réel", text: "Les tarifs d’électricité devraient refléter le coût réel de la fourniture, avec une aide publique réservée aux plus pauvres.",
      ctx: "Depuis 2024, les clients de la « Bande A », qui reçoivent au moins 20 heures d’électricité par jour, paient un tarif au coût réel. Le gouvernement dit avoir dépensé environ 3 140 milliards de nairas en subventions à l’électricité entre mi-2023 et fin 2025 et prévoit de les supprimer progressivement.",
      n: { apc: "Le gouvernement a créé le tarif Bande A et prévoit de supprimer progressivement les subventions restantes.", adc: "Amaechi, colistier d’Atiku, affirme qu’un gouvernement ADC subventionnerait l’électricité et supprimerait les Bandes A et B." } },
    { short: "Électricité hors du réseau national", text: "Les États, les communautés et les entreprises devraient pouvoir construire leurs propres centrales et mini-réseaux, plutôt que de dépendre du réseau national.",
      ctx: "La loi de 2023 sur l’électricité permet aux États de réguler leur propre marché et autorise la production privée. Le réseau national s’est effondré à plusieurs reprises. Ses détracteurs craignent que des marchés fragmentés laissent les États pauvres de côté.",
      n: { apc: "Tinubu a signé la loi de 2023 qui permet aux États et au privé de produire et distribuer l’électricité.", ndc: "Obi veut reproduire partout les modèles indépendants qui fonctionnent, avec plus de participation privée.", apm: "Makinde cite la décentralisation de la production d’électricité vers les États comme modèle." } },
    { short: "Ogoniland : dépollution avant le pétrole", text: "La production de pétrole en pays ogoni ne devrait pas reprendre avant la fin de la dépollution et l’accord des communautés locales.",
      ctx: "L’extraction pétrolière en pays ogoni est arrêtée depuis 1993. Une dépollution recommandée par l’ONU a commencé il y a des années, et des militants estiment qu’elle pourrait durer encore des décennies. Le gouvernement fédéral prépare la reprise de la production. Les associations ogoni et des ONG de défense des droits veulent d’abord la réparation et la justice.",
      n: { apc: "Le gouvernement prépare la reprise de la production, liée à son objectif de production pétrolière pour 2026." } }
  ]
};

  q: [
    { short: "Não repor o subsídio à gasolina", text: "A Nigéria não deve repor o subsídio à gasolina, mesmo que os preços nas bombas continuem altos.",
      ctx: "O governo federal acabou com o subsídio à gasolina em maio de 2023. Os defensores dizem que custava biliões de nairas por ano e beneficiava sobretudo contrabandistas e consumidores com mais posses. Os críticos dizem que o fim do subsídio fez subir os preços dos transportes e da comida para todos.",
      n: { apc: "Acabou com o subsídio em maio de 2023 e não o repôs.", adc: "Atiku: «Vou repô-lo.» A sua equipa fala de um subsídio limitado, dirigido à refinação nacional, e não do antigo subsídio à importação.", ndc: "Obi apoia o fim do subsídio, mas diz que deveria ter sido gradual e transparente.", apm: "Makinde exclui o antigo subsídio e quer um sistema de preços transparente que inclua a vantagem do crude nacional no preço das refinarias.", aac: "O AAC diz que repor o subsídio é a sua primeira prioridade." } },
    { short: "Vender as refinarias públicas", text: "As refinarias públicas devem ser vendidas a investidores privados em vez de reparadas com dinheiro público.",
      ctx: "A Nigéria gastou grandes somas a reabilitar as refinarias de Port Harcourt, Warri e Kaduna, que produziram pouco. Vendê-las poderia acabar com os prejuízos. Os críticos receiam que bens nacionais sejam vendidos a baixo preço a pessoas próximas do poder.",
      n: { apc: "A NNPC disse em 2025 que a refinaria de Port Harcourt não está à venda e procurou parceiros privados para a operar.", adc: "Atiku chama à privatização «a opção mais viável» e diz que as refinarias deviam ter sido vendidas antes de qualquer reabilitação.", apm: "Makinde quer uma NNPC Ltd gerida comercialmente e uma propriedade das refinarias reestruturada, sem falar de venda total.", aac: "O AAC quer as refinarias a funcionar em plena capacidade e culpa a má gestão, não a propriedade pública." },
      nd: { ndc: "Obi não se pronunciou sobre a propriedade das refinarias na campanha de 2026." } },
    { short: "Cortar o custo da classe política", text: "Os gastos federais com a classe política devem ser fortemente cortados: menos ministros e assessores, nenhum avião presidencial novo, nenhum gabinete da Primeira-Dama pago pelo Estado.",
      ctx: "A dimensão do governo federal e os gastos com viaturas e aviões oficiais provocam regularmente indignação. A Constituição exige pelo menos um ministro por cada um dos 36 estados.",
      n: { adc: "O programa da ADC promete um Estado mais eficiente e menos desperdício, sem cortes concretos.", ndc: "Obi critica os gastos com aviões e luxos e diz que a sua esposa não teria gabinete pago pelo Estado.", aac: "O AAC promete cortar gastos com titulares de cargos, assessores, comitivas e viaturas de luxo." } },
    { short: "Polícias estaduais", text: "Cada um dos 36 estados deve poder criar a sua própria polícia.",
      ctx: "A Nigéria tem uma única polícia federal, com cerca de um agente por cada 650 habitantes. Uma emenda constitucional que cria polícias estaduais foi aprovada pela Assembleia Nacional em 2026 e precisa da aprovação de 24 das 36 assembleias estaduais. Os críticos receiam que os governadores usem a polícia contra os opositores.",
      n: { apc: "O presidente Tinubu enviou a emenda sobre polícias estaduais à Assembleia Nacional, que a aprovou em 2026.", adc: "O programa da ADC apoia um «policiamento descentralizado» num sistema de segurança a quatro níveis.", ndc: "Obi apoia o princípio da polícia estadual, mas depois das eleições de 2027 e com uma comissão independente.", apm: "Makinde quer que os governadores controlem as forças de segurança dos seus estados.", aac: "Sowore apoia polícias federal, estaduais e locais, mas não comandantes totalmente controlados pelos governadores." } },
    { short: "Ataques militares estrangeiros", text: "A Nigéria deve autorizar forças armadas estrangeiras, como as dos EUA, a atacar grupos terroristas em território nigeriano.",
      ctx: "Em 25 de dezembro de 2025, forças americanas atacaram campos ligados ao Estado Islâmico no estado de Sokoto, em coordenação com o governo nigeriano. Os defensores saúdam o reforço contra os terroristas. Os opositores veem uma ameaça à soberania e ao papel das forças armadas nigerianas.",
      n: { apc: "O governo autorizou os ataques em Sokoto como «cooperação de segurança estruturada com parceiros internacionais».", adc: "A ADC reafirmou a sua oposição a forças estrangeiras em solo nigeriano e só aceitou os ataques em Sokoto como solução provisória.", aac: "Sowore condenou ataques feitos sem o verdadeiro consentimento da Nigéria." },
      nd: { ndc: "Obi diz que trabalharia com «parceiros nacionais e internacionais», mas não se pronunciou sobre ataques estrangeiros." } },
    { short: "Nenhum resgate, nenhuma negociação", text: "O Estado nunca deve pagar resgates nem negociar com sequestradores e bandidos armados.",
      ctx: "Os raptos em massa para pedir resgate continuam frequentes, incluindo de alunos. Algumas autoridades locais tentaram acordos de paz com grupos armados no passado. Outros defendem que qualquer pagamento ou acordo financia o próximo ataque.",
      n: { apc: "Tinubu, julho de 2026: «Recusamo-nos a negociar com criminosos»; não será pago nenhum resgate.", adc: "A ADC quer classificar raptos e banditismo como terrorismo, com penas mais duras. Não se pronunciou diretamente sobre negociações." } },
    { short: "Grupos de segurança comunitários", text: "Os grupos de segurança comunitários e regionais, como o Amotekun no Sudoeste, devem ser reforçados e autorizados a trabalhar ao lado da polícia.",
      ctx: "Vários estados criaram os seus próprios grupos de segurança para colmatar falhas das forças federais. Conhecem o terreno. Os críticos alertam que podem ser difíceis de controlar e visar certas comunidades.",
      n: { adc: "O sistema da ADC começa com informações locais e prevenção a nível estadual.", ndc: "Obi defende «mecanismos comunitários legais» de deteção precoce de ameaças.", apm: "Makinde cita o Amotekun e as vigilâncias de bairro como base de uma polícia estadual.", aac: "Sowore também apoia polícias locais, de campus e de bairro." } },
    { short: "Transmissão eletrónica obrigatória", text: "A transmissão eletrónica em tempo real dos resultados das assembleias de voto para o portal público da INEC (IReV) deve ser obrigatória por lei.",
      ctx: "A Lei Eleitoral de 2026 deixa a transmissão eletrónica facultativa e mantém a contagem manual como referência legal. Os defensores da obrigatoriedade dizem que limitaria a manipulação entre a assembleia de voto e o centro de apuramento. Os opositores invocam a fraca cobertura de rede nas zonas rurais.",
      n: { apc: "O presidente Tinubu apoiou manter a transmissão facultativa, invocando a cobertura e o risco de falhas.", adc: "Atiku chamou à recusa de a tornar obrigatória «um grave retrocesso para a reforma eleitoral».", ndc: "Obi apoia a transmissão obrigatória em tempo real.", aac: "Sowore juntou-se aos protestos na Assembleia Nacional para a exigir." } },
    { short: "Reestruturação", text: "A Constituição deve transferir poderes e receitas importantes do governo federal para os estados («reestruturação»).",
      ctx: "O governo federal controla a polícia, as minas, os caminhos de ferro e a maior parte das receitas públicas. A reestruturação passaria mais disto para os estados. Os defensores dizem que se adapta à diversidade da Nigéria. Os críticos receiam que os estados mais pobres fiquem para trás.",
      n: { adc: "Atiku chama à reestruturação «um dos pilares» do seu governo, com mais poderes para estados e governos locais.", ndc: "Obi disse que incluiria a reestruturação na sua governação, sem pormenores.", apm: "Makinde defende uma reforma constitucional rumo ao federalismo fiscal, à reestruturação e à polícia estadual." },
      nd: { apc: "O governo do APC apoia transferências concretas (polícia estadual, produção de eletricidade), mas não adotou um programa amplo de reestruturação." } },
    { short: "Financiamento direto dos governos locais", text: "Os governos locais devem receber diretamente as suas verbas federais, sem que os governadores controlem o dinheiro.",
      ctx: "Em julho de 2024, o Supremo Tribunal decidiu que os estados não podem reter nem gerir os fundos dos governos locais. Na prática, muitos governadores ainda controlam essas finanças. O pagamento direto pode aproximar os serviços das pessoas, ou apenas passar a má gestão para outro nível.",
      n: { apc: "Tinubu avisou os governadores para respeitarem a decisão e ameaçou pagar diretamente aos municípios.", adc: "Atiku prometeu mais poderes e autonomia aos governos locais.", aac: "Sowore quer mais autonomia local e acusa os governadores de ficarem com os fundos municipais." } },
    { short: "Universidades públicas gratuitas", text: "As universidades públicas devem ser gratuitas, em vez de depender de empréstimos estudantis.",
      ctx: "Desde 2024, o fundo federal de empréstimos estudantis (NELFUND) emprestou mais de 300 mil milhões de nairas a mais de 1,6 milhões de estudantes. Os defensores dizem que os empréstimos alargam o acesso. Os críticos dizem que os licenciados sem emprego terão dificuldade em pagar.",
      n: { apc: "Tinubu quer tornar o sistema de empréstimos permanente. O governo não prometeu a gratuitidade.", adc: "A equipa de Atiku chama ao empréstimo estudantil «uma dívida» e promete perdoar certas dívidas estudantis.", ndc: "Em 2022, Obi prometia tanto mais financiamento para as universidades como empréstimos estudantis.", aac: "O AAC promete ensino gratuito em todos os níveis." } },
    { short: "Estado de emergência na educação", text: "O governo federal deve declarar estado de emergência na educação e aumentar fortemente a despesa com o ensino.",
      ctx: "A Nigéria tem um dos maiores números de crianças fora da escola do mundo, e as universidades públicas foram afetadas por greves repetidas dos professores.",
      n: { adc: "O programa da ADC declara estado de emergência na educação.", ndc: "Obi promete mais investimento em escolas, formação de professores, tecnologia e ensino profissional.", aac: "Sowore promete ensino e exames públicos gratuitos, o que exigiria muito mais despesa pública." },
      nd: { apm: "Makinde promete «um novo caminho para a educação», sem pormenores." } },
    { short: "Ensino na língua materna", text: "As crianças devem aprender na sua língua materna nos primeiros anos do ensino primário.",

    { short: "Seguro de saúde alargado", text: "O seguro de saúde deve ser alargado para cobrir a maioria dos nigerianos, pagando o Estado pelos mais pobres.",

    { short: "Um centro de saúde em cada circunscrição", text: "A despesa com a saúde deve aumentar fortemente, com um centro de saúde primário a funcionar plenamente em cada uma das 8 809 circunscrições da Nigéria.",

    { short: "Aumentar e indexar o salário mínimo", text: "O salário mínimo de 70 000 ₦ deve ser aumentado já e ajustado todos os anos ao custo de vida, em vez de revisto de três em três anos.",

    { short: "Transferências em dinheiro como principal apoio", text: "As transferências diretas de dinheiro para famílias pobres são a melhor forma de amortecer o custo das reformas económicas.",

      n: { apc: "O governo diz estar a integrar as transferências no orçamento nacional, sem lei própria.", adc: "A ADC propõe uma Lei de Proteção Social." } },
    { short: "Tarifas de eletricidade ao custo real", text: "As tarifas de eletricidade devem refletir o custo real do fornecimento, com apoio público só para os mais pobres.",
      ctx: "Desde 2024, os clientes da «Banda A», que recebem pelo menos 20 horas de eletricidade por dia, pagam uma tarifa ao custo real. O governo diz ter gasto cerca de 3,14 biliões de nairas em subsídios à eletricidade entre meados de 2023 e o fim de 2025 e prevê acabar com eles gradualmente.",
      n: { apc: "O governo criou a tarifa Banda A e prevê acabar gradualmente com os restantes subsídios.", adc: "Amaechi, candidato a vice de Atiku, diz que um governo da ADC subsidiaria a eletricidade e acabaria com as Bandas A e B." } },
    { short: "Energia fora da rede nacional", text: "Estados, comunidades e empresas devem poder construir as suas próprias centrais e mini-redes, em vez de depender da rede nacional.",
      ctx: "A Lei da Eletricidade de 2023 permite aos estados regular o seu próprio mercado e autoriza a produção privada. A rede nacional colapsou várias vezes. Os críticos alertam que mercados fragmentados podem deixar para trás os estados mais pobres.",
      n: { apc: "Tinubu assinou a Lei da Eletricidade de 2023, que permite a estados e privados produzir e distribuir energia.", ndc: "Obi quer replicar em todo o país os modelos independentes que funcionam, com mais participação privada.", apm: "Makinde cita a descentralização da produção de energia para os estados como modelo." } },
    { short: "Ogoniland: limpeza antes do petróleo", text: "A produção de petróleo em Ogoniland não deve recomeçar antes de a limpeza estar concluída e de as comunidades locais concordarem.",

      n: { apc: "O governo prepara o recomeço da produção, ligado à sua meta de produção petrolífera para 2026." } }

  { short: "Président de l’INEC non nommé par le chef de l’État", text: "Le chef de l’État ne devrait plus nommer le président de la commission électorale (INEC) ; ce rôle devrait revenir au pouvoir judiciaire ou à un organe indépendant.",
    ctx: "La Constitution permet au chef de l’État de nommer le président et les commissaires de l’INEC, sous réserve de confirmation par le Sénat. En 2008, la commission Uwais sur la réforme électorale a recommandé de transférer ce pouvoir à la justice. Les opposants à cette idée disent qu’elle entraînerait les juges dans la politique.",
    n: { adc: "Le programme de l’ADC promet un organe électoral à l’abri des pressions de l’exécutif. Atiku défend depuis 2019 l’idée que le pouvoir judiciaire devrait nommer le président de l’INEC." },
    nd: { apc: "Le président Tinubu a nommé l’actuel président de l’INEC en 2025 selon les règles existantes et n’a pas proposé de changement." } },
  { short: "Sièges réservés aux femmes", text: "La Constitution devrait créer des sièges supplémentaires réservés aux femmes à l’Assemblée nationale et dans les assemblées des États.",
    ctx: "Les femmes occupent environ 4 % des sièges de l’Assemblée nationale. Un projet d’amendement constitutionnel en attente ajouterait, pour les femmes et pendant 16 ans, 12 sièges au Sénat, 37 à la Chambre des représentants et 108 dans les assemblées des États. Ses détracteurs jugent les quotas antidémocratiques ou disent qu’ils alourdiraient le coût de l’État.",
    n: { apc: "Les militants du projet affirment que la Première dame et le président national de l’APC le soutiennent. Le parti n’a pris aucun engagement formel dans son programme.", adc: "L’ADC réserve 35 % des postes du parti aux femmes et 35 % aux jeunes, mais ne s’est pas prononcée publiquement sur le projet d’amendement constitutionnel." } },
  { short: "Des agences anticorruption indépendantes", text: "Les agences anticorruption comme l’EFCC devraient être rendues légalement indépendantes de la présidence, afin qu’elles ne puissent pas être utilisées contre des opposants politiques.",
    ctx: "Le président nomme le dirigeant de la Commission des crimes économiques et financiers (EFCC). Les partis d’opposition accusent l’agence de cibler leurs membres tout en épargnant ceux qui rejoignent le parti au pouvoir. Le gouvernement affirme que l’agence agit en toute indépendance.",
    n: { adc: "Atiku affirme que les Nigérians « méritent des institutions réellement indépendantes » et que le président contrôle l’EFCC.", ndc: "Obi a cosigné en décembre 2025 une déclaration de l’opposition demandant que l’EFCC soit protégée des ingérences politiques et que sa loi soit modifiée." },
    nd: { apc: "Le gouvernement APC n’a pas proposé de changer le fonctionnement de l’EFCC ni le mode de nomination de son dirigeant." } },
  { short: "Pas de poursuites pour avoir critiqué les dirigeants", text: "Critiquer en ligne le président ou d’autres responsables, même durement, ne devrait jamais entraîner d’arrestation ni de poursuites.",
    ctx: "La loi sur la cybercriminalité punit certains messages en ligne. Des organisations de défense des droits affirment que la police et les services de sécurité l’utilisent contre des journalistes et des voix critiques. En 2025, le Service de sécurité de l’État a inculpé Omoyele Sowore pour une publication qualifiant le président de criminel. Les défenseurs de la loi disent qu’elle vise les fausses informations délibérées susceptibles de provoquer des troubles.",
    n: { apc: "Le Service de sécurité de l’État a inculpé Sowore en 2025 en vertu de la loi sur la cybercriminalité, pour des publications concernant le président Tinubu.", adc: "Atiku a qualifié la détention de Sowore en 2025 d’« attaque contre chaque Nigérian qui dit la vérité ».", ndc: "Obi a qualifié la détention de Sowore sans inculpation claire d’« abus de pouvoir de l’État »." },
    nd: { aac: "Sowore, candidat de l’AAC, est lui-même poursuivi en vertu de la loi sur la cybercriminalité et conteste les accusations. Ce pilote n’a trouvé aucune déclaration du parti sur la loi elle-même." } },
  { short: "Réexaminer l’autoroute côtière", text: "Les travaux de l’autoroute côtière Lagos–Calabar devraient être suspendus jusqu’à ce que son coût et l’attribution du marché soient examinés de façon indépendante.",
    ctx: "Cette autoroute de 700 km est l’un des projets phares du gouvernement ; Atiku estime son coût à plus de 13 milliards de dollars. Le premier tronçon a été attribué sans appel d’offres ouvert et concurrentiel. Ses partisans disent qu’elle désenclavera la côte et le delta du Niger.",
    n: { apc: "Le gouvernement construit l’autoroute. Ses soutiens affirment que le marché a été attribué légalement sans appel d’offres ouvert.", adc: "Atiku (2024) affirme que les règles de passation des marchés, l’étude d’impact environnemental et les procédures régulières n’ont pas été respectées." },
    nd: { ndc: "Obi a critiqué le projet, mais ce pilote n’a trouvé aucun appel de sa part à le suspendre." } },
  { short: "Des dirigeants soignés au pays", text: "Le président et les hauts responsables ne devraient pas pouvoir utiliser l’argent public pour se faire soigner à l’étranger.",
    ctx: "Les responsables nigérians partent souvent se faire soigner à l’étranger, alors que les hôpitaux locaux manquent d’équipements et de personnel. Des propositions de loi visant à limiter les voyages médicaux financés sur fonds publics ont été déposées à l’Assemblée nationale, mais pas adoptées. Leurs partisans disent que les responsables remettraient alors en état les hôpitaux qu’ils fréquentent.",
    n: { ndc: "Obi (janvier 2025) a exhorté le président Tinubu à se faire soigner dans les hôpitaux nationaux du Nigeria, pour rétablir la confiance en eux." } },
  { short: "Pas d’impôt pour les petits revenus", text: "Les personnes à bas revenus et les très petites entreprises ne devraient payer aucun impôt sur le revenu.",
    ctx: "Avec les lois fiscales en vigueur depuis janvier 2026, les personnes gagnant jusqu’à environ 1,2 million de nairas par an, et les entreprises dont le chiffre d’affaires ne dépasse pas 100 millions de nairas, ne paient pas d’impôt sur le revenu. D’autres estiment qu’une base fiscale très étroite rend l’État dépendant de la TVA et de l’emprunt.",
    n: { apc: "Les nouvelles lois fiscales exonèrent d’impôt sur le revenu les revenus jusqu’à environ 1,2 million de nairas par an ainsi que les petites entreprises.", adc: "L’ADC propose d’exonérer d’impôt le « revenu de survie »." } },
  { short: "Importations alimentaires sans droits de douane", text: "Pour faire baisser rapidement les prix alimentaires, les denrées de base comme le riz et le maïs devraient être importées sans droits de douane, même si les agriculteurs locaux font face à plus de concurrence.",
    ctx: "En juillet 2024, alors que l’inflation alimentaire dépassait 40 %, le gouvernement a suspendu pendant 150 jours les droits d’importation sur certaines denrées de base. Des organisations d’agriculteurs ont affirmé que les importations bon marché cassaient les prix des producteurs locaux. Les partisans de la mesure disaient que les familles avaient besoin d’être soulagées tout de suite.",
    n: { apc: "Le gouvernement a suspendu en juillet 2024 les droits et taxes sur certaines denrées de base importées.", adc: "Atiku affirme que le Nigeria importe « une nourriture qui devrait être cultivée dans nos champs » et veut un modèle « Produire au Nigeria »." } },
  { short: "Du pâturage libre aux ranchs", text: "Le pâturage libre devrait être progressivement supprimé dans tout le Nigeria, et les éleveurs installés dans des ranchs.",
    ctx: "Les affrontements entre éleveurs et agriculteurs ont fait des milliers de morts. Plusieurs États du Sud ont interdit le pâturage libre, et des groupes d’éleveurs se sont opposés à ces interdictions. En 2025, le gouvernement fédéral a créé un ministère de l’Élevage et lancé un programme pilote de ranchs, sans interdiction nationale.",
    n: { apc: "Tinubu (novembre 2025) a exhorté les éleveurs à « mettre fin au pâturage libre » : « L’élevage en ranch est désormais la voie à suivre. » Son ministère de l’Élevage affirme qu’il n’y a pas d’interdiction nationale, seulement une transition progressive.", adc: "Atiku (2022) estime que le pâturage relève de chaque État et s’oppose à une loi nationale sur la question, dans un sens comme dans l’autre.", apm: "En tant que gouverneur de l’État d’Oyo, Makinde a déclaré le pâturage libre illégal dans son État (2021)." } },
  { short: "Crédit bon marché à long terme pour les producteurs", text: "L’État devrait accorder aux agriculteurs et aux industriels des prêts à long terme et à faible taux d’intérêt, par l’intermédiaire de banques publiques de développement.",
    ctx: "Au Nigeria, les taux des prêts commerciaux dépassent souvent 25 % depuis que la banque centrale a relevé son taux directeur pour lutter contre l’inflation. Le crédit public bon marché peut stimuler la production, mais les dispositifs passés ont souffert de prêts non remboursés et de favoritisme politique.",
    n: { adc: "Atiku propose un « crédit à long terme et abordable » pour les agriculteurs et les industriels.", ndc: "Obi promet un crédit moins cher pour faire passer l’économie de la consommation à la production." } },
  { short: "Introduire la NNPC en Bourse", text: "NNPC Ltd devrait être introduite en Bourse, afin que les investisseurs privés et les citoyens puissent en acheter des actions.",
    ctx: "La loi de 2021 sur l’industrie pétrolière a transformé la compagnie pétrolière nationale en société à responsabilité limitée. La NNPC a indiqué viser une cotation de ses actions d’ici 2028. Les partisans d’une cotation disent qu’elle imposerait la transparence ; ses détracteurs craignent que la richesse pétrolière nationale finisse entre les mains de quelques investisseurs.",
    n: { apc: "Tinubu (août 2026) a déclaré que la NNPC serait réformée puis cotée en Bourse, en citant Saudi Aramco comme modèle.", adc: "Atiku (2019) prévoyait de confier les raffineries à des opérateurs privés. Il ne s’est pas prononcé sur une cotation de la NNPC en Bourse.", apm: "Makinde veut faire de la NNPC « une institution allégée, efficace et gérée commercialement », par la restructuration et des partenariats." } }
);
