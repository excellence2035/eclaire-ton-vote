NG_I18N.pt.system.splice(2, 0, ["Como é eleita a Assembleia Nacional", "Três senadores por estado mais um pelo Território da Capital Federal (109), e 360 membros da Câmara dos Representantes. Cada um é eleito num círculo uninominal: ganha o candidato com mais votos."]);
NG_I18N.pt.others = ["PDP · Sandy Onor (não comparado: ainda sem posições políticas detalhadas publicadas)", "PRP · Donald Duke", "SDP · Adewole Adebayo", "LP · Sunday Okereke", "e mais 9 candidatos aprovados pela INEC (18 no total)"];
NG_I18N.pt.q.push(
  { short: "Manter o naira flutuante", text: "O naira deve continuar a flutuar livremente, com o seu valor definido pela oferta e pela procura, em vez de ser gerido ou fixado pelo banco central.",
    ctx: "Em junho de 2023, o Banco Central da Nigéria unificou as taxas de câmbio e deixou o naira flutuar. O naira perdeu grande parte do seu valor, o que fez subir os preços das importações e da comida, mas a diferença em relação ao mercado paralelo diminuiu. Com uma flutuação gerida, o banco central orientaria a taxa de forma mais ativa.",
    n: { apc: "O governo de Tinubu unificou as taxas de câmbio e deixou o naira flutuar em 2023, e manteve essa política.", adc: "Atiku (2024) considerou a flutuação livre «um exagero» e disse que uma flutuação gerida, com o banco central a intervir para estabilizar o naira, teria sido melhor.", ndc: "Obi diz que vai manter a flutuação e não voltar às taxas de câmbio múltiplas, e que vai aumentar a produção para fortalecer o naira." } },
  { short: "Manter as leis fiscais de 2026", text: "As novas leis fiscais em vigor desde janeiro de 2026 devem manter-se, em vez de serem suspensas para revisão.",
    ctx: "Quatro leis de reforma fiscal assinadas em junho de 2025 entraram em vigor a 1 de janeiro de 2026. Isentam quem ganha pouco e as pequenas empresas, mas dão à administração fiscal mais poderes de cobrança. Deputados e líderes da oposição disseram que os textos publicados eram diferentes do que a Assembleia Nacional tinha aprovado e pediram uma pausa.",
    n: { apc: "O governo manteve a entrada em vigor a 1 de janeiro de 2026; o responsável pela reforma fiscal disse que as leis foram «concebidas para dar alívio».", adc: "Atiku pediu que as leis fossem suspensas e investigadas, e classificou as alegadas alterações ao texto como «falsificação».", ndc: "Obi diz que a aplicação das leis deve ser posta em pausa e chama «extorsão» a um sistema fiscal sem benefícios públicos visíveis." } },
  { short: "Reduzir o endividamento federal", text: "O governo federal deve reduzir fortemente os novos empréstimos, mesmo que alguns projetos tenham de ser adiados.",
    ctx: "A dívida pública da Nigéria cresceu depressa desde 2023, em parte porque a desvalorização do naira aumentou o valor dos empréstimos estrangeiros. O governo previa cerca de 15 biliões de nairas de serviço da dívida para 2026. Diz que os empréstimos financiam infraestruturas e reformas; os críticos dizem que os novos empréstimos estão a pagar os antigos.",
    n: { apc: "O governo continua a contrair novos empréstimos, incluindo um empréstimo de 1,25 mil milhões de dólares pedido ao Banco Mundial em 2026.", adc: "A ADC acusa o governo de gerir uma «economia Ponzi», contraindo novos empréstimos para pagar dívidas antigas.", ndc: "Obi (2025) diz que pedir emprestado não é mau em si, mas que o endividamento atual não tem prestação de contas nem impacto produtivo." } },
  { short: "Diálogo, não força, com os vizinhos", text: "A Nigéria deve excluir o uso da força militar para restabelecer o poder civil em países vizinhos como o Níger, e apostar no diálogo.",
    ctx: "Depois do golpe de Estado de julho de 2023 no Níger, a CEDEAO, então presidida pelo presidente Tinubu, impôs sanções e ameaçou com uma intervenção militar. O Níger, o Mali e o Burkina Faso saíram depois da CEDEAO e formaram a Aliança dos Estados do Sahel. A Nigéria partilha com o Níger uma fronteira de cerca de 1 500 km.",
    n: { apc: "Em agosto de 2023, como presidente da CEDEAO, Tinubu preferia a diplomacia, mas disse que «nenhuma opção foi retirada da mesa».", adc: "Atiku (2023) apelou à CEDEAO para não «seguir o caminho das hostilidades militares» e para apostar na diplomacia.", ndc: "Obi (2023) disse que «deve ser dada primazia ao diálogo e à diplomacia» em vez da dissuasão armada." } },
  { short: "Um mandato único de seis anos", text: "O presidente e os governadores devem cumprir um mandato único de seis anos, em vez de até dois mandatos de quatro anos.",
    ctx: "Os defensores dizem que um mandato único acabaria com campanhas de reeleição dispendiosas e permitiria aos dirigentes concentrar-se em governar. Os críticos dizem que os eleitores perderiam a oportunidade de reeleger um bom dirigente ou de afastar mais cedo um mau. A Câmara dos Representantes rejeitou um projeto de lei nesse sentido em novembro de 2024.",
    n: { adc: "Atiku (2024) pediu à Assembleia Nacional um mandato único de seis anos, em rotação entre as seis zonas geopolíticas.", apm: "Makinde (2025): «um mandato único de cinco ou seis anos é, na verdade, suficiente para nos concentrarmos e fazermos o trabalho»." },
    nd: { ndc: "Obi compromete-se a cumprir ele próprio um só mandato de quatro anos, mas não propôs alterar a Constituição.", apc: "O APC não tomou posição pública sobre o mandato único." } },
  { short: "Só primárias diretas", text: "Os partidos devem escolher os seus candidatos por votação de todos os militantes inscritos (primárias diretas), e não através de delegados.",
    ctx: "A Lei Eleitoral de 2026 aboliu as primárias indiretas, em que os delegados escolhem o candidato, deixando apenas as primárias diretas e o consenso. Os defensores da medida dizem que os delegados eram fáceis de comprar. Os partidos da oposição dizem que cada partido deve ser livre de escolher o seu próprio método.",
    n: { apc: "A Lei Eleitoral de 2026, assinada pelo presidente Tinubu, aboliu as primárias indiretas.", adc: "Os dirigentes da ADC rejeitaram esta restrição em fevereiro de 2026 e querem que as primárias indiretas continuem a ser uma opção." } },
  { short: "Presidente da INEC não escolhido pelo chefe de Estado", text: "O chefe de Estado não deve continuar a nomear o presidente da comissão eleitoral (INEC); essa escolha deve caber ao poder judicial ou a um órgão independente.",
    ctx: "A Constituição permite ao chefe de Estado nomear o presidente e os comissários da INEC, sujeitos a confirmação pelo Senado. Em 2008, o painel Uwais para a reforma eleitoral recomendou passar esta competência para o poder judicial. Os opositores dizem que isso arrastaria os juízes para a política.",
    n: { adc: "O programa da ADC promete um órgão eleitoral livre de interferência do executivo. Atiku defende desde 2019 que deve ser o poder judicial a nomear o presidente da INEC." },
    nd: { apc: "O presidente Tinubu nomeou o atual presidente da INEC em 2025, segundo as regras em vigor, e não propôs qualquer mudança." } },
  { short: "Lugares reservados a mulheres", text: "A Constituição deve criar lugares adicionais reservados a mulheres na Assembleia Nacional e nas assembleias estaduais.",
    ctx: "As mulheres ocupam cerca de 4% dos lugares na Assembleia Nacional. Um projeto de emenda constitucional pendente acrescentaria, para mulheres e durante 16 anos, 12 lugares no Senado, 37 na Câmara dos Representantes e 108 nas assembleias estaduais. Os críticos consideram as quotas antidemocráticas ou dizem que aumentariam o custo do Estado.",
    n: { apc: "Os ativistas dizem que a Primeira-Dama e o presidente nacional do APC apoiam o projeto. O partido não assumiu nenhum compromisso formal no seu programa.", adc: "A ADC reserva 35% dos cargos do partido a mulheres e 35% a jovens, mas não se pronunciou publicamente sobre o projeto de emenda constitucional." } },
  { short: "Agências anticorrupção independentes", text: "As agências anticorrupção, como a EFCC, devem tornar-se legalmente independentes da Presidência, para não poderem ser usadas contra opositores políticos.",
    ctx: "O presidente nomeia o líder da Comissão de Crimes Económicos e Financeiros (EFCC). Os partidos da oposição acusam a agência de visar os seus membros e poupar quem adere ao partido no poder. O governo diz que a agência atua de forma independente.",
    n: { adc: "Atiku diz que os nigerianos «merecem instituições verdadeiramente independentes» e que o presidente controla a EFCC.", ndc: "Obi subscreveu, em dezembro de 2025, uma declaração da oposição a pedir que a EFCC seja protegida de interferências políticas e que a sua lei seja alterada." },
    nd: { apc: "O governo do APC não propôs alterar o funcionamento da EFCC nem a forma como o seu líder é nomeado." } },
  { short: "Não processar quem critica os dirigentes", text: "Criticar o presidente ou outros governantes na internet, mesmo duramente, nunca deve levar a detenção ou a processo judicial.",
    ctx: "A Lei dos Cibercrimes pune certas mensagens publicadas na internet. Organizações de direitos humanos dizem que a polícia e os serviços de segurança a usam contra jornalistas e críticos. Em 2025, o Serviço de Segurança do Estado acusou Omoyele Sowore por causa de uma publicação que chamava criminoso ao presidente. Os defensores da lei dizem que ela visa falsidades deliberadas que possam provocar distúrbios.",
    n: { apc: "O Serviço de Segurança do Estado acusou Sowore ao abrigo da Lei dos Cibercrimes em 2025, por publicações sobre o presidente Tinubu.", adc: "Atiku chamou à detenção de Sowore em 2025 «um ataque a cada nigeriano que diz a verdade».", ndc: "Obi chamou à detenção de Sowore sem acusações claras «um abuso do poder do Estado»." },
    nd: { aac: "Sowore, candidato do AAC, está ele próprio a ser processado ao abrigo da Lei dos Cibercrimes e contesta as acusações. Este piloto não encontrou nenhuma declaração do partido sobre a lei em si." } },
  { short: "Rever a autoestrada costeira", text: "As obras da autoestrada costeira Lagos–Calabar devem ser suspensas até que o seu custo e a adjudicação do contrato sejam revistos de forma independente.",
    ctx: "A autoestrada de 700 km é um dos projetos emblemáticos do governo; Atiku estima o seu custo em mais de 13 mil milhões de dólares. O primeiro troço foi adjudicado sem concurso público aberto. Os defensores dizem que vai abrir o litoral e o Delta do Níger.",
    n: { apc: "O governo está a construir a autoestrada. Os seus apoiantes dizem que o contrato foi adjudicado legalmente sem concurso público aberto.", adc: "Atiku (2024) diz que as regras de contratação pública, a avaliação de impacto ambiental e o devido processo não foram respeitados." },
    nd: { ndc: "Obi criticou o projeto, mas este piloto não encontrou nenhum apelo seu para o suspender." } },
  { short: "Dirigentes tratados no país", text: "O presidente e os altos responsáveis não devem poder usar dinheiro público para tratamentos médicos no estrangeiro.",
    ctx: "Os governantes nigerianos vão muitas vezes tratar-se ao estrangeiro, enquanto faltam equipamentos e pessoal nos hospitais locais. Foram apresentados na Assembleia Nacional projetos de lei para restringir as viagens médicas pagas pelo Estado, mas não foram aprovados. Os defensores dizem que, assim, os governantes melhorariam os hospitais que usam.",
    n: { ndc: "Obi (janeiro de 2025) instou o presidente Tinubu a tratar-se nos hospitais nacionais da Nigéria, para restaurar a confiança neles." } },
  { short: "Sem imposto para quem ganha pouco", text: "Quem ganha pouco e as empresas muito pequenas não devem pagar imposto sobre o rendimento.",
    ctx: "Com as leis fiscais em vigor desde janeiro de 2026, quem ganha até cerca de 1,2 milhões de nairas por ano e as empresas com volume de negócios igual ou inferior a 100 milhões de nairas não pagam imposto sobre o rendimento. Outros defendem que uma base tributária muito estreita faz o Estado depender do IVA e de empréstimos.",
    n: { apc: "As novas leis fiscais isentam de imposto sobre o rendimento os rendimentos até cerca de 1,2 milhões de nairas por ano e as pequenas empresas.", adc: "A ADC propõe isentar de impostos o «rendimento de sobrevivência»." } },
  { short: "Importar alimentos sem direitos aduaneiros", text: "Para baixar depressa os preços dos alimentos, os alimentos básicos como o arroz e o milho devem ser importados sem direitos aduaneiros, mesmo que os agricultores locais enfrentem mais concorrência.",
    ctx: "Em julho de 2024, com a inflação alimentar acima de 40%, o governo suspendeu durante 150 dias os direitos de importação sobre alguns alimentos básicos. As associações de agricultores disseram que as importações baratas esmagavam os preços dos produtores locais. Os defensores da medida disseram que as famílias precisavam de alívio imediato.",
    n: { apc: "O governo suspendeu em julho de 2024 os direitos e taxas sobre alguns alimentos básicos importados.", adc: "Atiku diz que a Nigéria importa «comida que devia ser cultivada nos nossos campos» e quer um modelo «Produzir na Nigéria»." } },
  { short: "Do pastoreio livre aos ranchos", text: "O pastoreio livre deve ser eliminado gradualmente em toda a Nigéria, com os pastores transferidos para ranchos.",
    ctx: "Os confrontos entre pastores e agricultores mataram milhares de pessoas. Vários estados do Sul proibiram o pastoreio livre, e grupos de pastores opuseram-se a essas proibições. Em 2025, o governo federal criou um ministério da pecuária e lançou um programa-piloto de ranchos, sem proibição a nível nacional.",
    n: { apc: "Tinubu (novembro de 2025) apelou aos pastores para «acabarem com o pastoreio livre»: «A criação em ranchos é agora o caminho a seguir.» O seu ministério da pecuária diz que não há proibição nacional, apenas uma transição gradual.", adc: "Atiku (2022) diz que o pastoreio é uma questão de cada estado e opõe-se a legislação nacional, seja em que sentido for.", apm: "Como governador do estado de Oyo, Makinde declarou ilegal o pastoreio livre no seu estado (2021)." } },

NG_I18N.ar.q.push(
  { short: "إبقاء تعويم النايرا", text: "يجب أن يبقى سعر صرف النايرا حرًا تحدده قوى العرض والطلب، بدل أن يديره البنك المركزي أو يثبّته.",
    ctx: "في يونيو 2023 وحّد البنك المركزي النيجيري أسعار الصرف وعوّم النايرا. فقدت العملة جزءًا كبيرًا من قيمتها، ما رفع أسعار الواردات والغذاء، لكن الفجوة مع السوق الموازية تقلّصت. أما في ظل التعويم المُدار، فيتدخل البنك المركزي بنشاط أكبر في توجيه السعر.",
    n: { apc: "وحّدت حكومة تينوبو أسعار الصرف وعوّمت النايرا عام 2023، وأبقت على هذه السياسة.", adc: "وصف أتيكو (2024) التعويم الحر بأنه «إجراء مُفرط»، وقال إن تعويمًا مُدارًا، يتدخل فيه البنك المركزي لتحقيق استقرار النايرا، كان سيكون أفضل.", ndc: "يقول أوبي إنه سيُبقي على التعويم ولن يعود إلى تعدد أسعار الصرف، وسيرفع الإنتاج لتقوية النايرا." } },
  { short: "الإبقاء على قوانين الضرائب لعام 2026", text: "يجب الإبقاء على قوانين الضرائب الجديدة السارية منذ يناير 2026، بدل تعليقها لمراجعتها.",
    ctx: "دخلت أربعة قوانين لإصلاح الضرائب، وُقّعت في يونيو 2025، حيز التنفيذ في 1 يناير 2026. وهي تعفي ذوي الدخل المنخفض والشركات الصغيرة، لكنها تمنح السلطات الضريبية صلاحيات تحصيل أقوى. وقال مشرّعون وقادة معارضون إن النصوص المنشورة تختلف عمّا أقرّته الجمعية الوطنية، وطالبوا بتعليقها مؤقتًا.",
    n: { apc: "أبقت الحكومة على موعد البدء في 1 يناير 2026، وقال المسؤول عن إصلاح الضرائب فيها إن القوانين «صُممت لتخفيف العبء».", adc: "طالب أتيكو بتعليق القوانين والتحقيق فيها، واصفًا التعديلات المزعومة على النص بأنها «تزوير».", ndc: "يقول أوبي إنه يجب تعليق القوانين مؤقتًا، ويصف نظامًا ضريبيًا لا يحقق منافع عامة ملموسة بأنه «ابتزاز»." } },
  { short: "تقليص الاقتراض الاتحادي", text: "يجب أن تخفض الحكومة الاتحادية الاقتراض الجديد بشدة، حتى لو اضطرت إلى تأجيل بعض المشاريع.",
    ctx: "نما الدين العام في نيجيريا بسرعة منذ 2023، ويعود ذلك جزئيًا إلى أن ضعف النايرا رفع قيمة القروض الخارجية. وقدّرت الحكومة خدمة الدين لعام 2026 بنحو 15 تريليون نايرا. وهي تقول إن القروض تموّل البنية التحتية والإصلاحات، ويقول المنتقدون إن القروض الجديدة تُستخدم لسداد القديمة.",
    n: { apc: "تواصل الحكومة الحصول على قروض جديدة، منها قرض بقيمة 1.25 مليار دولار من البنك الدولي طُلب عام 2026.", adc: "تتهم ADC الحكومة بإدارة «اقتصاد بونزي»، عبر الحصول على قروض جديدة لخدمة الديون القديمة.", ndc: "يرى أوبي (2025) أن الاقتراض ليس سيئًا في حد ذاته، لكن الاقتراض الحالي يفتقر إلى المساءلة والأثر الإنتاجي." } },
  { short: "الحوار لا القوة مع دول الجوار", text: "يجب أن تستبعد نيجيريا استخدام القوة العسكرية لإعادة الحكم المدني في دول الجوار مثل النيجر، وأن تعتمد على الحوار.",
    ctx: "بعد انقلاب يوليو 2023 في النيجر، فرضت المجموعة الاقتصادية لدول غرب أفريقيا (إيكواس)، التي كان يرأسها حينها الرئيس تينوبو، عقوبات ولوّحت بالتدخل العسكري. ثم انسحبت النيجر ومالي وبوركينا فاسو من إيكواس وأسست تحالف دول الساحل. وتتقاسم نيجيريا مع النيجر حدودًا يبلغ طولها نحو 1500 كيلومتر.",
    n: { apc: "في أغسطس 2023، وبصفته رئيسًا لإيكواس، فضّل تينوبو الدبلوماسية لكنه قال إنه «لم يُسحب أي خيار من على الطاولة».", adc: "حثّ أتيكو (2023) إيكواس على ألا «تسلك طريق الأعمال العدائية العسكرية» وعلى انتهاج الدبلوماسية.", ndc: "قال أوبي (2023) إن «الأولوية يجب أن تُعطى للحوار والدبلوماسية» بدل الردع المسلح." } },
  { short: "ولاية واحدة من ست سنوات", text: "يجب أن يتولى الرئيس وحكام الولايات مناصبهم لولاية واحدة مدتها ست سنوات، بدل ولايتين كحد أقصى مدة كل منهما أربع سنوات.",
    ctx: "يقول المؤيدون إن الولاية الواحدة ستُنهي حملات إعادة الانتخاب المكلفة وتتيح للقادة التفرغ للحكم. ويقول المنتقدون إن الناخبين سيفقدون فرصة إعادة انتخاب قائد جيد أو إزاحة قائد سيئ في وقت أبكر. وقد رفض مجلس النواب مشروع قانون من هذا النوع في نوفمبر 2024.",
    n: { adc: "طلب أتيكو (2024) من الجمعية الوطنية ولاية واحدة مدتها ست سنوات، بالتناوب بين المناطق الجيوسياسية الست.", apm: "ماكيندي (2025): «ولاية واحدة من خمس أو ست سنوات كافية فعلًا للتركيز وإنجاز العمل»." },
    nd: { ndc: "يتعهد أوبي بأن يكتفي هو نفسه بولاية واحدة من أربع سنوات، لكنه لم يقترح تعديل الدستور.", apc: "لم يتخذ حزب APC موقفًا علنيًا من الولاية الواحدة." } },
  { short: "انتخابات تمهيدية مباشرة فقط", text: "يجب أن تختار الأحزاب مرشحيها بتصويت جميع أعضائها المسجلين (انتخابات تمهيدية مباشرة)، لا عبر المندوبين.",
    ctx: "ألغى قانون الانتخابات لعام 2026 الانتخابات التمهيدية غير المباشرة، التي يختار فيها المندوبون المرشح، ولم يُبقِ إلا الانتخابات التمهيدية المباشرة والتوافق. يقول المؤيدون إن شراء المندوبين كان سهلًا، وتقول أحزاب المعارضة إن لكل حزب الحق في اختيار طريقته.",
    n: { apc: "ألغى قانون الانتخابات لعام 2026، الذي وقّعه الرئيس تينوبو، الانتخابات التمهيدية غير المباشرة.", adc: "رفض قادة ADC هذا القيد في فبراير 2026، ويريدون أن تبقى الانتخابات التمهيدية غير المباشرة خيارًا متاحًا." } },
  { short: "رئيس اللجنة الانتخابية لا يعيّنه الرئيس", text: "يجب ألا يعيّن رئيس الجمهورية بعد الآن رئيس اللجنة الانتخابية (INEC)، بل أن تتولى ذلك السلطة القضائية أو هيئة مستقلة.",
    ctx: "يخوّل الدستور الرئيس تعيين رئيس اللجنة الانتخابية وأعضائها، رهنًا بمصادقة مجلس الشيوخ. وفي عام 2008 أوصت لجنة أويس لإصلاح الانتخابات بنقل هذه الصلاحية إلى السلطة القضائية. ويقول المعارضون إن ذلك سيزجّ بالقضاة في السياسة.",
    n: { adc: "يعد برنامج ADC بهيئة انتخابية بمنأى عن تدخل السلطة التنفيذية. ويرى أتيكو منذ 2019 أن السلطة القضائية هي التي يجب أن تعيّن رئيس اللجنة الانتخابية." },
    nd: { apc: "عيّن الرئيس تينوبو رئيس اللجنة الانتخابية الحالي عام 2025 وفق القواعد القائمة، ولم يقترح أي تغيير." } },
  { short: "مقاعد مخصصة للنساء", text: "يجب أن ينشئ الدستور مقاعد إضافية مخصصة للنساء في الجمعية الوطنية وفي مجالس الولايات.",
    ctx: "تشغل النساء نحو 4% من مقاعد الجمعية الوطنية. ومن شأن مشروع تعديل دستوري قيد النظر أن يضيف للنساء 12 مقعدًا في مجلس الشيوخ و37 مقعدًا في مجلس النواب و108 مقاعد في مجالس الولايات، لمدة 16 عامًا. ويصف المنتقدون الحصص بأنها غير ديمقراطية، أو يقولون إنها ستزيد كلفة الحكم.",
    n: { apc: "يقول ناشطون إن السيدة الأولى والرئيس الوطني لحزب APC يدعمان المشروع. ولم يقطع الحزب أي التزام رسمي في برنامجه.", adc: "تخصص ADC نسبة 35% من مناصب الحزب للنساء و35% للشباب، لكنها لم تتناول علنًا مشروع التعديل الدستوري." } },
  { short: "هيئات مستقلة لمكافحة الفساد", text: "يجب أن تُمنح هيئات مكافحة الفساد، مثل EFCC، استقلالًا قانونيًا عن الرئاسة، حتى لا يمكن استخدامها ضد الخصوم السياسيين.",
    ctx: "يعيّن الرئيس رئيس لجنة الجرائم الاقتصادية والمالية (EFCC). وتتهم أحزاب المعارضة اللجنة باستهداف أعضائها مع التغاضي عمّن ينضمون إلى الحزب الحاكم. وتقول الحكومة إن اللجنة تعمل باستقلالية.",
    n: { adc: "يقول أتيكو إن النيجيريين «يستحقون مؤسسات مستقلة حقًا»، وإن الرئيس يتحكم في لجنة EFCC.", ndc: "وقّع أوبي مع آخرين بيانًا للمعارضة في ديسمبر 2025 يطالب بحماية لجنة EFCC من التدخل السياسي وتعديل قانونها." },
    nd: { apc: "لم تقترح حكومة APC تغيير طريقة إدارة لجنة EFCC أو طريقة تعيين رئيسها." } },
  { short: "لا ملاحقة بسبب انتقاد المسؤولين", text: "يجب ألا يؤدي انتقاد الرئيس أو مسؤولين آخرين عبر الإنترنت، حتى لو كان حادًا، إلى الاعتقال أو الملاحقة القضائية أبدًا.",
    ctx: "يعاقب قانون الجرائم الإلكترونية على بعض الرسائل المنشورة عبر الإنترنت. وتقول منظمات حقوقية إن الشرطة والأجهزة الأمنية تستخدمه ضد الصحفيين والمنتقدين. وفي عام 2025 وجّه جهاز أمن الدولة اتهامات إلى أوموييلي سووري بسبب منشور وصف فيه الرئيس بأنه مجرم. ويقول المدافعون عن القانون إنه يستهدف الأكاذيب المتعمدة التي قد تثير الاضطرابات.",
    n: { apc: "وجّه جهاز أمن الدولة اتهامات إلى سووري بموجب قانون الجرائم الإلكترونية عام 2025 بسبب منشورات عن الرئيس تينوبو.", adc: "وصف أتيكو احتجاز سووري عام 2025 بأنه «اعتداء على كل نيجيري يقول الحقيقة».", ndc: "وصف أوبي احتجاز سووري دون تهم واضحة بأنه «إساءة لاستخدام سلطة الدولة»." },
    nd: { aac: "سووري، مرشح حزب AAC، ملاحَق هو نفسه بموجب قانون الجرائم الإلكترونية ويطعن في التهم. ولم تعثر هذه التجربة على أي تصريح للحزب بشأن القانون نفسه." } },
  { short: "مراجعة الطريق الساحلي السريع", text: "يجب تعليق العمل في الطريق الساحلي السريع بين لاغوس وكالابار إلى أن تخضع كلفته وطريقة إرساء عقده لمراجعة مستقلة.",
    ctx: "يُعدّ الطريق البالغ طوله 700 كيلومتر من أبرز مشاريع الحكومة، ويقدّر أتيكو كلفته بأكثر من 13 مليار دولار. وقد أُرسي عقد القسم الأول دون مناقصة تنافسية مفتوحة. ويقول المؤيدون إنه سيفك العزلة عن الساحل ودلتا النيجر.",
    n: { apc: "تبني الحكومة الطريق. ويقول مؤيدوها إن العقد أُرسي بصورة قانونية دون مناقصة مفتوحة.", adc: "يقول أتيكو (2024) إن قواعد الشراء العام وتقييم الأثر البيئي والإجراءات القانونية الواجبة لم تُحترم." },
    nd: { ndc: "انتقد أوبي المشروع، لكن هذه التجربة لم تجد دعوة منه إلى تعليقه." } },
  { short: "علاج المسؤولين داخل البلاد", text: "يجب ألا يُسمح للرئيس وكبار المسؤولين باستخدام المال العام للعلاج في الخارج.",
    ctx: "كثيرًا ما يسافر المسؤولون النيجيريون إلى الخارج للعلاج، بينما تفتقر المستشفيات المحلية إلى المعدات والكوادر. وقد قُدّمت إلى الجمعية الوطنية مشاريع قوانين لتقييد الرحلات العلاجية الممولة من المال العام، لكنها لم تُقرّ. ويقول المؤيدون إن المسؤولين سيعملون حينها على إصلاح المستشفيات التي يرتادونها.",
    n: { ndc: "حثّ أوبي (يناير 2025) الرئيس تينوبو على تلقي العلاج في المستشفيات الوطنية النيجيرية، لاستعادة الثقة بها." } },
  { short: "إعفاء ذوي الدخل المنخفض من ضريبة الدخل", text: "يجب ألا يدفع ذوو الدخل المنخفض والمشاريع الصغيرة جدًا أي ضريبة على الدخل.",
    ctx: "بموجب قوانين الضرائب السارية منذ يناير 2026، لا يدفع ضريبة الدخل من يكسبون حتى نحو 1.2 مليون نايرا سنويًا، ولا الشركات التي يبلغ رقم أعمالها 100 مليون نايرا أو أقل. ويرى آخرون أن ضيق القاعدة الضريبية الشديد يجعل الدولة تعتمد على ضريبة القيمة المضافة والاقتراض.",
    n: { apc: "تعفي قوانين الضرائب الجديدة الدخل الذي يصل إلى نحو 1.2 مليون نايرا سنويًا والشركات الصغيرة من ضريبة الدخل.", adc: "تقترح ADC إعفاء «دخل الكفاف» من الضريبة." } },
  { short: "استيراد الغذاء معفى من الرسوم", text: "لخفض أسعار الغذاء بسرعة، يجب استيراد الأغذية الأساسية مثل الأرز والذرة دون رسوم جمركية، حتى لو واجه المزارعون المحليون منافسة أكبر.",
    ctx: "في يوليو 2024، ومع تجاوز تضخم أسعار الغذاء 40%، علّقت الحكومة الرسوم الجمركية على بعض الأغذية الأساسية لمدة 150 يومًا. وقالت جمعيات المزارعين إن الواردات الرخيصة أضرت بالمنتجين المحليين. وقال المؤيدون إن الأسر كانت بحاجة إلى إغاثة فورية.",
    n: { apc: "علّقت الحكومة في يوليو 2024 الرسوم والضرائب على بعض الأغذية الأساسية المستوردة.", adc: "يقول أتيكو إن نيجيريا تستورد «غذاءً يجب أن يُزرع في حقولنا»، ويريد نموذج «أنتِج في نيجيريا»." } },
  { short: "من الرعي المفتوح إلى مزارع المواشي", text: "يجب إلغاء الرعي المفتوح تدريجيًا في كل أنحاء نيجيريا، مع نقل الرعاة إلى مزارع لتربية المواشي.",
    ctx: "أودت الاشتباكات بين الرعاة والمزارعين بحياة الآلاف. وقد حظرت عدة ولايات جنوبية الرعي المفتوح، وعارضت جماعات الرعاة هذا الحظر. وفي عام 2025 أنشأت الحكومة الاتحادية وزارة للثروة الحيوانية وأطلقت برنامجًا تجريبيًا لمزارع المواشي، دون حظر على المستوى الوطني.",
    n: { apc: "حثّ تينوبو (نوفمبر 2025) الرعاة على «إنهاء الرعي المفتوح»: «تربية المواشي في المزارع هي الطريق إلى الأمام الآن». وتقول وزارته للثروة الحيوانية إنه لا يوجد حظر وطني، بل انتقال تدريجي فقط.", adc: "يقول أتيكو (2022) إن الرعي شأن يخص كل ولاية، ويعارض أي تشريع وطني في هذا الاتجاه أو ذاك.", apm: "بصفته حاكمًا لولاية أويو، أعلن ماكيندي الرعي المفتوح غير قانوني في ولايته (2021)." } },
  { short: "قروض ميسّرة طويلة الأجل للمنتجين", text: "يجب أن تمنح الدولة المزارعين والمصنّعين قروضًا طويلة الأجل بفوائد منخفضة، عبر بنوك تنمية عامة.",
    ctx: "كثيرًا ما تتجاوز أسعار الفائدة على القروض التجارية في نيجيريا 25% منذ أن رفع البنك المركزي سعر الفائدة الأساسي لمكافحة التضخم. ويمكن للائتمان العام الرخيص أن يعزز الإنتاج، لكن برامج سابقة عانت من قروض لم تُسدَّد ومن المحاباة السياسية.",
    n: { adc: "يقترح أتيكو «ائتمانًا طويل الأجل وميسور الكلفة» للمزارعين والمصنّعين.", ndc: "يعد أوبي بائتمان أرخص لنقل الاقتصاد من الاستهلاك إلى الإنتاج." } },
  { short: "إدراج NNPC في البورصة", text: "يجب إدراج شركة NNPC المحدودة في البورصة، حتى يتمكن المستثمرون من القطاع الخاص والمواطنون من شراء أسهم فيها.",
    ctx: "حوّل قانون صناعة النفط لعام 2021 شركة النفط الوطنية إلى شركة محدودة المسؤولية. وأعلنت NNPC أنها تهدف إلى إدراج أسهمها بحلول عام 2028. يقول المؤيدون إن الإدراج سيفرض الشفافية، ويخشى المنتقدون أن تنتهي ثروة البلاد النفطية في أيدي قلة من المستثمرين.",

    { theme: "securite", short: "Contrôle indépendant de la police",

    { theme: "securite", short: "Peines exécutées sans aménagement",

      ctx: "Une grande partie des courtes peines de prison sont aménagées (bracelet électronique, semi-liberté). La France compte plus de 80 000 détenus pour environ 62 000 places. Limiter les aménagements rend la sanction plus certaine, mais aggrave la surpopulation carcérale.",

        tondelier: { p: -1, k: "stated", s: "fr_v_rt", n: "Numerus clausus en prison : pas de détenu sans place." }

    /* ---------- Immigration ---------- */
    { theme: "immigration", short: "Supprimer l’AME",
      text: "Il faut supprimer l’Aide médicale d’État (AME) pour les étrangers sans papiers et la remplacer par une aide limitée aux urgences.",
      ctx: "L’AME prend en charge les soins de plusieurs centaines de milliers de personnes en situation irrégulière, pour un peu plus d’un milliard d’euros par an. Ses partisans veulent réduire l’attrait de la France ; ses opposants, dont de nombreux médecins, rappellent que soigner tôt évite des urgences plus coûteuses et des risques d’épidémie.",
      cells: {
        lepen: { p: 2, k: "stated", s: "fr_ifrap", n: "Remplacer l’AME par une aide médicale d’urgence." },

        retailleau: { p: 1, k: "stated", s: "fr_ifrap", n: "Réduire le nombre de bénéficiaires et les soins couverts." }
      } },
    { theme: "immigration", short: "Supprimer le droit du sol",
      text: "Il faut supprimer le droit du sol : un enfant né en France de parents étrangers ne deviendrait plus français automatiquement.",
      ctx: "Aujourd’hui, un enfant né en France de parents étrangers devient français à 18 ans s’il y a vécu au moins cinq ans depuis ses 11 ans. Le droit du sol a déjà été restreint à Mayotte. Certains juristes estiment que le supprimer partout exigerait de réviser la Constitution.",

        zemmour: { p: 2, k: "stated", s: "fr_ifrap", n: "Fin du droit du sol." },

    { theme: "immigration", short: "Référendum sur l’immigration",
      text: "Il faut organiser un référendum sur l’immigration, quitte à réviser la Constitution pour le permettre.",
      ctx: "L’article 11 de la Constitution ne permet pas aujourd’hui de soumettre directement aux Français la plupart des règles d’immigration. Ses partisans veulent « rendre la parole au peuple » ; ses opposants craignent un vote qui contourne le Parlement et les droits fondamentaux.",
      cells: {
        lepen: { p: 2, k: "stated", s: "fr_v_al", n: "Consulter les Français par référendum sur l’immigration." },
        retailleau: { p: 2, k: "stated", s: "fr_entrevue", n: "Réviser l’article 11 pour permettre un référendum sur le droit du sol et le regroupement familial." },

        glucksmann: { p: -1, k: "stated", s: "fr_ps_glu", n: "Propose plutôt une convention citoyenne tirée au sort, suivie d’un vote du Parlement." }

    { theme: "immigration", short: "Forte baisse de l’immigration légale",
      text: "Il faut réduire fortement l’immigration légale, avec des quotas votés par le Parlement et un regroupement familial restreint.",
      ctx: "La France délivre chaque année plus de 300 000 premiers titres de séjour, surtout pour des études, pour raisons familiales et pour le travail. Les partisans d’une baisse veulent mieux maîtriser l’intégration ; ses opposants rappellent les besoins de main-d’œuvre et le droit de vivre en famille, protégé par les traités.",

        retailleau: { p: 2, k: "stated", s: "fr_alg360", n: "Réduire drastiquement le regroupement familial." },

        tondelier: { p: -2, k: "stated", s: "fr_v_rt", n: "Voies légales d’immigration et démantèlement de Frontex." }

    { theme: "immigration", short: "Régulariser les travailleurs sans papiers",
      text: "Il faut régulariser les travailleurs sans papiers déjà employés en France, en particulier dans les métiers qui manquent de bras.",
      ctx: "Plusieurs centaines de milliers d’étrangers vivent en France sans titre de séjour, dont beaucoup travaillent dans le bâtiment, la restauration ou l’aide à la personne. Une circulaire de janvier 2025 a durci les régularisations au cas par cas.",

        lepen: { p: -2, k: "stated", s: "fr_v_al", n: "Expulser systématiquement les personnes en situation irrégulière." },
        zemmour: { p: -2, k: "stated", s: "fr_v_rz", n: "Renvoyer les clandestins." }

    { theme: "immigration", short: "Dénoncer l’accord de 1968",

    { theme: "immigration", short: "Aides sociales après 5 ans",

    { theme: "ecologie", short: "Pesticides réautorisés en 2026",

    { theme: "europe", short: "Droit français avant le droit européen",

  mFormula1: "توضع كل إجابة على مقياس من −2 (غير موافق إطلاقًا) إلى +2 (موافق تمامًا). في كل سؤال نقيس الفرق بين موقفك وموقف الحزب: التوافق = 1 − |الفرق| ÷ 4.",
  mFormula2: "تُحتسب أسئلة القضايا ذات الأولوية مرتين، وكذلك الأسئلة التي تحددها بأنها «مضاعفة». ولا تُحتسب إلا الأسئلة التي لدى الحزب فيها موقف موثّق. يضيف «+ 3 × 50%» ما يعادل ثلاث إجابات محايدة، فيبقى الحزب قليل التوثيق قريبًا من 50% إلى أن تتوفر معلومات كافية. وفي كل قضية تُضاف إجابة محايدة واحدة.",
  mCoding: [
    "يُرمَّز كل موقف استنادًا إلى وثيقة عامة مؤرخة: برنامج الحزب أو تصريح مرشحه للرئاسة أو تصويت برلماني أو إجراء حكومي.",
    "أربعة أنواع من الأدلة: برنامج أو تصريح حديث، تصويت أو إجراء، الموقف الرسمي للحزب، موقف سابق للحملة.",
    "عند غياب مصدر موثوق يُصنَّف الموقف «غير موثّق» ولا يُحتسب السؤال لذلك الحزب.",
    "الخطوة التالية: تدقيق هذا الترميز من لجنة مستقلة، ثم إرسال الاستبيان إلى الأحزاب لتجيب وتعلّل بنفسها."
  ],
  mCovTitle: "المواقف الموثّقة لكل حزب",
  mCovParty: "الحزب",

/* ================== Calcul ================== */
function accord(v, p) { return 1 - Math.abs(v - p) / 4; }

    const top = Math.round(eligible[0].s * 100);
    const tied = eligible.filter(r => Math.round(r.s * 100) === top);
    title = tied.length > 1 ? L.resTie(tied.map(r => pname(r.p)).join(", ")) : L.resClosest(`${pname(eligible[0].p)} (${eligible[0].p.sigle})`);
    const pr = state.priorities.map(id => E.themes.find(x => x.id === id).name).join(", ") || L.none;
    summary = L.resSummary(a, E.questions.length, pr);
  }
  const country = state.country === "fr" ? E.name : cname("566");
  show(`
    <div class="res-head">
      <p class="eyebrow">${L.resEyebrow} · ${esc(country)}</p>
      <h1 class="big-title">${esc(title)}</h1>
      <p>${esc(summary)}</p>
    </div>
    <div class="tabs" role="tablist">${L.tabs.map((x, k) => `<button class="tab" role="tab" id="tab${k}" aria-controls="pan${k}" aria-selected="${state.tab === k}" type="button" data-tab="${k}">${x}</button>`).join("")}</div>
    <div class="panel" role="tabpanel" id="pan0" aria-labelledby="tab0" ${state.tab === 0 ? "" : "hidden"}>${panelRanking(rank, a)}</div>
    <div class="panel" role="tabpanel" id="pan1" aria-labelledby="tab1" ${state.tab === 1 ? "" : "hidden"}>${panelThemes()}</div>
    <div class="panel" role="tabpanel" id="pan2" aria-labelledby="tab2" ${state.tab === 2 ? "" : "hidden"}>${panelQuestions()}</div>
    <div class="panel" role="tabpanel" id="pan3" aria-labelledby="tab3" ${state.tab === 3 ? "" : "hidden"}>${panelMethod()}</div>
    <div class="actions">
      <button class="btn btn-ghost" type="button" data-go="edit">${L.actEdit}</button>
      <button class="btn btn-ghost" type="button" data-go="restart">${L.actRestart}</button>
      <button class="btn btn-ghost" type="button" data-go="home">${L.changeCountry}</button>
    </div>
  `, 2);
}
function panelRanking(rank, a) {
  const L = t();
  let pos = 0;
  return `<ol class="rank">${rank.map(r => {
    const has = r.s !== null;
    if (r.ok) pos++;
    return `<li class="${r.ok ? (pos === 1 ? "top" : "") : "out"}">
      <span class="pos">${r.ok ? pos : "–"}</span>
      ${badge(r.p)}
      <div class="rank-main">
        <div class="rank-head"><b>${pname(r.p)}</b><span class="pct">${has && r.ok ? pctTxt(r.s) : "–"}</span></div>
        <div class="bar" style="--pc:var(--c-${r.p.id})" role="img" aria-label="${has && r.ok ? Math.round(r.s * 100) + " " + L.pctWord : L.notRanked}"><span style="width:${has && r.ok ? (r.s * 100).toFixed(1) : 0}%"></span></div>
        <div class="rank-sub"><span>${candLine(r.p, L)}</span><span>${r.ok ? L.compared(r.k, a) : L.notRanked}</span>${r.ok && r.partial ? `<span class="chip warn">${L.partial}</span>` : ""}${r.p.chip ? `<span class="chip grey">${r.p.chip}</span>` : ""}<button class="link" type="button" data-fiche="${r.p.id}">${L.seeProfile}</button></div>
      </div>
    </li>`;
  }).join("")}</ol>
  <p class="caveat">${L.rankCaveat}</p>`;
}
function panelThemes() {
  const E = ed(), L = t();
  const order = [...state.priorities.map(id => E.themes.find(x => x.id === id)), ...E.themes.filter(x => !state.priorities.includes(x.id))];
  return `<p class="verdict-line">${L.byThemeIntro}</p>
  <div class="theme-cards">${order.map(th => {
    const on = state.priorities.includes(th.id);
    const qIdx = E.questions.map((q, i) => q.theme === th.id ? i : -1).filter(i => i >= 0);
    const answered = qIdx.some(i => typeof state.answers[i] === "number");
    const head = `<div class="tc-head"><h3>${th.name}</h3>${on ? `<span class="chip">${L.prio}</span>` : ""}</div>`;
    if (!answered) {
      const first = state.order.indexOf(qIdx[0]);
      return `<article class="theme-card${on ? " prio-on" : ""}">${head}<p class="skipped-note">${L.themeNotAnswered}</p><div><button class="link" type="button" data-goto="${first}">${L.answerTheme}</button></div></article>`;
    }
    const r = ranking(th.id);
    const ok = r.filter(x => x.ok);
    let phrase;
    if (!ok.length) phrase = L.themeNoData;
    else {
      const top = Math.round(ok[0].s * 100);
      const tied = ok.filter(x => Math.round(x.s * 100) === top);
      phrase = tied.length > 1
        ? L.themeTie(th.name, tied.map(x => `<b>${pname(x.p)}</b>`).join(", "), pctTxt(ok[0].s))
        : L.themeVerdict(th.name, `${pname(ok[0].p)} (${ok[0].p.sigle})`, pctTxt(ok[0].s), ok[0].k);
    }
    return `<article class="theme-card${on ? " prio-on" : ""}">${head}
      <p class="verdict-line">${phrase}</p>
      <div class="mini">${r.map(x => x.ok
        ? `<div class="mini-row">${badge(x.p, "sm")}<span class="name">${pname(x.p)}</span><div class="bar" style="--pc:var(--c-${x.p.id})"><span style="width:${(x.s * 100).toFixed(1)}%"></span></div><span class="pct">${pctTxt(x.s)}</span></div>`
        : `<div class="mini-row nd">${badge(x.p, "sm")}<span class="name">${pname(x.p)}</span><span class="ndt" style="font-size:.82rem;font-style:italic">${L.notDoc}</span><span></span></div>`).join("")}
      </div>
    </article>`;
  }).join("")}</div>`;
}
function panelQuestions() {
  const E = ed(), L = t();
  return state.order.map((qi, k) => {
    const q = E.questions[qi];
    const v = state.answers[qi];
    const th = E.themes.find(x => x.id === q.theme);
    const cols = [2, 1, 0, -1, -2].map(val => {
      const ps = E.parties.filter(p => q.cells[p.id] && q.cells[p.id].p === val);
      return `<div class="scale-col"><span class="lbl">${L.ansShort[val]}</span><div class="stack">${v === val ? `<span class="you">${L.you}</span>` : ""}${ps.map(p => badge(p, "sm")).join("")}</div></div>`;
    }).join("");
    const nd = E.parties.filter(p => !q.cells[p.id]);
    const yours = typeof v === "number"
      ? `<p style="font-size:.92rem">${L.yourAnswer}${C()} <b>${L.ans[v]}</b></p>`
      : `<p class="skipped-note">${v === null ? L.youSkipped : L.youNotYet}</p>`;
    return `<article class="qa">
      <div class="qa-meta"><span class="mono">${nn(k + 1)}</span><span>${th.name}</span>${state.priorities.includes(q.theme) ? `<span class="chip">${L.prio}</span>` : ""}${state.double[qi] ? `<span class="chip grey">×2</span>` : ""}</div>
      <p class="qa-text">${q.text}</p>
      ${yours}
      <div class="scale-wrap"><div class="scale">${cols}</div></div>
      ${nd.length ? `<p class="nd-line">${L.noDocLine} ${nd.map(p => `<span class="chip grey">${p.sigle}</span>`).join("")}</p>` : ""}
      <details><summary>${L.whatTheySay}</summary>
        <ul class="why-list">${E.parties.map(p => {
          const c = q.cells[p.id];
          if (c) return `<li>${badge(p, "sm")}<div><span class="pos-label">${pname(p)} · ${L.ans[c.p]}</span> <span class="kind">· ${L.kinds[c.k]}</span><p>${c.n}</p><p class="src">${L.source}${C()} ${srcLink(c.s)}</p></div></li>`;
          const note = q.nd && q.nd[p.id];
          return `<li>${badge(p, "sm")}<div><span class="pos-label" style="font-weight:400;font-style:italic">${pname(p)} · ${L.notDoc}</span>${note ? `<p>${note}</p>` : ""}</div></li>`;
        }).join("")}</ul>
      </details>
      <div><button class="link" type="button" data-goto="${k}">${typeof v === "number" ? L.edit : L.answerIt}</button></div>
    </article>`;
  }).join("");
}
function panelMethod() {
  const E = ed(), L = t();
  const used = [...new Set([...E.factsSrc, ...(E.systemSrc || []), E.othersSrc, ...E.parties.map(p => p.tagSrc).filter(Boolean), ...E.questions.flatMap(q => Object.values(q.cells).map(c => c.s)), ...E.parties.flatMap(p => p.commit.map(c => c[1]))])].filter(id => SRC[id]);
  return `<div class="method">
    <h3>${L.mFormulaTitle}</h3>
    <p>${L.mFormula1}</p>
    <p class="formula" dir="ltr">${L.formula}</p>
    <p>${L.mFormula2}</p>
    <h3>${L.mCodingTitle}</h3>
    <ul>${L.mCoding.map(x => `<li>${x}</li>`).join("")}${state.country === "ng" ? `<li>${L.mTransl}</li>` : ""}</ul>
    <h3>${L.mCovTitle}</h3>
    <div class="tbl-wrap"><table class="cov"><thead><tr><th>${L.mCovParty}</th><th style="text-align:end">${L.mCovN}</th></tr></thead><tbody>
      ${E.parties.map(p => ({ p, n: documented(p.id) })).sort((x, y) => y.n - x.n).map(({ p, n }) => `<tr><td>${label(p)}</td><td class="num">${n} / ${E.questions.length}</td></tr>`).join("")}
    </tbody></table></div>
    <h3>${L.mNotTitle}</h3>
    <ul>${L.mNot.map(x => `<li>${x}</li>`).join("")}</ul>
    <h3>${L.mSrcTitle}</h3>
    <ol class="src-list">${used.map(id => `<li><a href="${SRC[id].u}" target="_blank" rel="noopener">${esc(SRC[id].t)}</a> · ${esc(SRC[id].o)}, ${esc(SRC[id].d)}</li>`).join("")}</ol>
  </div>`;
}

/* ================== Fiche candidat ================== */
function openFiche(pid) {
  const E = ed(), L = t();
  const p = E.parties.find(x => x.id === pid);
  const sc = answeredCount() ? score(pid) : { s: null, k: 0 };
  $("ficheBody").innerHTML = `
    <div class="fiche-head">
      ${badge(p, "lg")}
      <div><h2 id="ficheTitle">${pname(p)}</h2><p>${candLine(p, L)}${p.vp ? ` · ${L.runningMate}${C()} ${p.vp}` : ""}</p></div>
      <button class="close" type="button" id="ficheClose" aria-label="${L.ficheClose}">×</button>
    </div>
    ${p.chip ? `<p><span class="chip warn">${p.chip}</span></p>` : ""}
    <p style="font-size:.95rem">${p.tag}${p.tagSrc ? ` <span class="src muted">(${srcLink(p.tagSrc)})</span>` : ""}</p>
    ${sc.k >= 2 ? `<div class="fiche-score"><span class="pct">${pctTxt(sc.s)}</span><span>${L.ficheScore}</span></div>` : ""}
    <p class="mono muted" style="font-size:.85rem">${L.ficheDoc(documented(pid), E.questions.length)}</p>
    <section><h3>${L.ficheCommit}</h3><ul class="commit">${p.commit.map(([c, s]) => `<li><span>${c}</span><span class="src muted">${L.source}${C()} ${srcLink(s)}</span></li>`).join("")}</ul></section>
    <section><h3>${L.fichePos}</h3><ul class="pos-table">${E.questions.map(q => {
      const c = q.cells[pid];
      return `<li><span>${q.short}</span><span class="pv${c ? "" : " nd"}">${c ? L.ans[c.p] : L.notDoc}</span></li>`;
    }).join("")}</ul></section>`;
  const dlg = $("fiche");
  if (typeof dlg.showModal === "function") { if (!dlg.open) dlg.showModal(); } else dlg.setAttribute("open", "");
  dlg.scrollTop = 0;
  $("ficheClose").focus();
}
function closeFiche() { const d = $("fiche"); if (d.open) { if (typeof d.close === "function") d.close(); else d.removeAttribute("open"); } }

/* ================== Navigation ================== */
function resetAnswers() { state.answers = {}; state.double = {}; state.i = 0; state.tab = 0; state.order = []; }
function go(where) {
  clearTimeout(advanceTimer);
  switch (where) {
    case "home": closeFiche(); viewMap(); break;
    case "france": state.ui = "fr"; startEdition("fr"); break;
    case "nigeria": startEdition("ng"); break;
    case "startq": buildOrder(); state.i = 0; viewQuestion(); break;
    case "prev": if (state.i > 0) { state.i--; viewQuestion(); } break;
    case "more": state.i = state.nPrio; viewQuestion(); break;
    case "results": state.tab = 0; viewResults(); break;
    case "edit": state.i = 0; viewQuestion(); break;
    case "restart": resetAnswers(); state.priorities = []; viewStart(); break;
  }
}
document.addEventListener("click", e => {
  if (e.target === $("langDlg")) return closeLang();
  if (e.target === $("fiche")) return closeFiche();
  const el = e.target.closest("[data-pick],[data-place],[data-lang],[data-go],[data-prio],[data-val],[data-goto],[data-tab],[data-fiche],#ficheClose,#langCancel,#brand");
  if (!el) return;
  if (el.id === "ficheClose") return closeFiche();
  if (el.id === "langCancel") return closeLang();
  if (el.id === "brand") return go("home");
  if (el.dataset.pick) return pickLang(el.dataset.pick);
  if (el.dataset.place) return openLang(el.dataset.place);
  if (el.dataset.lang) { state.ui = el.dataset.lang; return rerender(); }
  if (el.dataset.go) return go(el.dataset.go);
  if (el.dataset.fiche) return openFiche(el.dataset.fiche);
  if (el.dataset.prio) {
    const id = el.dataset.prio;
    const k = state.priorities.indexOf(id);
    if (k >= 0) state.priorities.splice(k, 1); else if (state.priorities.length < 3) state.priorities.push(id);
    const y = window.scrollY;
    viewStart(true);
    window.scrollTo({ top: y });
    const again = document.querySelector(`[data-prio="${id}"]`); if (again) again.focus({ preventScroll: true });
    return;
  }
  if (el.dataset.val) return answer(el.dataset.val === "skip" ? null : +el.dataset.val);
  if (el.dataset.goto) {
    closeFiche();
    if (!state.order.length) buildOrder();
    state.i = +el.dataset.goto; return viewQuestion();
  }
  if (el.dataset.tab) {
    state.tab = +el.dataset.tab;
    document.querySelectorAll('[role="tab"]').forEach((b, k) => b.setAttribute("aria-selected", String(k === state.tab)));
    document.querySelectorAll('[role="tabpanel"]').forEach((p, k) => { p.hidden = k !== state.tab; });
  }
});
document.addEventListener("change", e => {
  if (e.target.id === "qDouble") state.double[state.order[state.i]] = e.target.checked;
});
document.addEventListener("keydown", e => {
  if (!e.target.closest || !e.target.closest('[role="tablist"]')) return;
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  const tabs = [...document.querySelectorAll('[role="tab"]')];
  const k = tabs.indexOf(document.activeElement);
  if (k < 0) return;
  const n = (k + (e.key === "ArrowRight" ? 1 : tabs.length - 1)) % tabs.length;
  tabs[n].focus(); tabs[n].click();
});

viewMap();
</script>
