# Configuration du Worker du compteur collectif (voir README.md).
name = "vote-meter"
main = "worker.js"
compatibility_date = "2024-09-23"

# Pas de journal des requêtes : le Worker ne garde ni adresses, ni contenus.
[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "vote-meter"
# Coller ici l'identifiant affiché par « npx wrangler d1 create vote-meter »
database_id = "REMPLACER-PAR-L-IDENTIFIANT-D1"
